/* ---------- fundo animado: uma rede com pacotes trafegando ---------- */
const NET = (() => {
  const cv = document.getElementById("net"), cx = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  let W = 0, H = 0, nodes = [], edges = [], adj = [], packets = [], rings = [], col = {}, last = 0, running = false, spawnT = 0;

  function colors(){
    const s = getComputedStyle(document.documentElement), g = n => s.getPropertyValue(n).trim();
    col = {line:g("--muted"), acc:g("--accent"), ok:g("--ok"), bad:g("--bad"), hot:g("--hot")};
  }
  function build(){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W*dpr; cv.height = H*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
    // nós numa grade com sorteio, para cobrir a tela sem amontoar
    const n = Math.round(Math.min(90, Math.max(22, W*H/17000)));
    const cols = Math.max(2, Math.ceil(Math.sqrt(n*W/H))), rows = Math.max(2, Math.ceil(n/cols)), cw = W/cols, rh = H/rows;
    nodes = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
      nodes.push({bx:(c+.18+Math.random()*.64)*cw, by:(r+.18+Math.random()*.64)*rh, ph:Math.random()*6.28,
                  sp:.25+Math.random()*.45, r:1.4+Math.random()*1.4, hub:Math.random() < .13, x:0, y:0});
    nodes.forEach(nd => { nd.x = nd.bx; nd.y = nd.by; });
    // cada nó liga aos vizinhos mais próximos (hubs ligam a mais)
    const seen = new Set(); edges = []; adj = nodes.map(() => []);
    nodes.forEach((a,i) => {
      nodes.map((b,j) => [j, (a.bx-b.bx)**2 + (a.by-b.by)**2]).filter(x => x[0] !== i)
        .sort((p,q) => p[1]-q[1]).slice(0, a.hub ? 4 : 2)
        .forEach(([j]) => { const k = Math.min(i,j)+"-"+Math.max(i,j); if (!seen.has(k)) { seen.add(k); edges.push([i,j]); adj[i].push(j); adj[j].push(i); } });
    });
    packets = []; rings = [];
  }
  // a rede aparece inteira nas laterais e bem fraca atrás da coluna de conteúdo
  function fade(x){
    if (W < 900) return .42;
    const half = Math.min(415, W/2), d = Math.abs(x - W/2);
    return d < half ? .16 : Math.min(1, .16 + (d-half)/150);
  }
  function spawn(c, from){
    if (!nodes.length) return;
    const i = from ?? Math.floor(Math.random()*nodes.length);
    const path = [i], hops = 2 + Math.floor(Math.random()*4);
    while (path.length <= hops) {
      const nb = adj[path[path.length-1]].filter(j => j !== path[path.length-2]);
      if (!nb.length) break;
      path.push(nb[Math.floor(Math.random()*nb.length)]);
    }
    if (path.length > 1) packets.push({path, seg:0, t:0, v:85+Math.random()*75, c:c || (Math.random() < .14 ? col.hot : col.acc)});
  }
  function nearest(x, y){
    let best = 0, bd = Infinity;
    nodes.forEach((nd,i) => { const d = (nd.x-x)**2 + 2*(nd.y-y)**2; if (d < bd) { bd = d; best = i; } });
    return best;
  }
  // reação às respostas: pacotes saem dos dois lados do card
  function burst(kind, el){
    if (!running || !nodes.length) return;
    const r = el?.getBoundingClientRect?.(), y = r ? Math.min(H-20, Math.max(20, r.top + Math.min(r.height,300)/2)) : H/2;
    const c = kind === "ok" ? col.ok : col.bad;
    const sides = [nearest(r ? r.left-70 : W*.12, y), nearest(r ? r.right+70 : W*.88, y)];
    sides.forEach(i => {
      rings.push({x:nodes[i].x, y:nodes[i].y, t:0, c, big:true});
      for (let q = 0; q < (kind === "ok" ? 4 : 2); q++) spawn(c, i);
    });
  }
  function frame(ts){
    const dt = last ? Math.min(.05, (ts-last)/1000) : 0; last = ts;
    const tt = ts/1000;
    cx.clearRect(0,0,W,H);
    if (running) nodes.forEach(nd => { nd.x = nd.bx + Math.sin(tt*nd.sp + nd.ph)*7; nd.y = nd.by + Math.cos(tt*nd.sp*.8 + nd.ph)*7; });
    cx.lineWidth = 1; cx.strokeStyle = col.line;
    edges.forEach(([i,j]) => {
      const a = nodes[i], b = nodes[j];
      cx.globalAlpha = .17*fade((a.x+b.x)/2);
      cx.beginPath(); cx.moveTo(a.x,a.y); cx.lineTo(b.x,b.y); cx.stroke();
    });
    nodes.forEach(nd => {
      const f = fade(nd.x);
      cx.globalAlpha = (nd.hub ? .6 : .32)*f; cx.fillStyle = nd.hub ? col.acc : col.line;
      cx.beginPath(); cx.arc(nd.x, nd.y, nd.hub ? nd.r+1.6 : nd.r, 0, 7); cx.fill();
      if (nd.hub) {
        const pulse = (Math.sin(tt*1.6 + nd.ph) + 1)/2;
        cx.globalAlpha = (.12 + .2*pulse)*f; cx.strokeStyle = col.acc;
        cx.beginPath(); cx.arc(nd.x, nd.y, nd.r + 5 + pulse*3, 0, 7); cx.stroke();
        cx.strokeStyle = col.line;
      }
    });
    if (running) {
      spawnT -= dt;
      if (spawnT <= 0) { spawn(); spawnT = .3 + Math.random()*.55; }
      if (packets.length > 46) packets.splice(0, packets.length - 46);
    }
    packets = packets.filter(p => {
      let a = nodes[p.path[p.seg]], b = nodes[p.path[p.seg+1]], len = Math.hypot(b.x-a.x, b.y-a.y) || 1;
      p.t += p.v*dt/len;
      if (p.t >= 1) {
        p.seg++; p.t = 0;
        if (p.seg >= p.path.length-1) { rings.push({x:b.x, y:b.y, t:0, c:p.c}); return false; }
        a = b; b = nodes[p.path[p.seg+1]]; len = Math.hypot(b.x-a.x, b.y-a.y) || 1;
      }
      const ux = (b.x-a.x)/len, uy = (b.y-a.y)/len, x = a.x + ux*len*p.t, y = a.y + uy*len*p.t, f = fade(x);
      const tl = Math.min(16, len*p.t), tx = x - ux*tl, ty = y - uy*tl;
      const g = cx.createLinearGradient(tx, ty, x, y); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, p.c);
      cx.globalAlpha = .85*f; cx.strokeStyle = g; cx.lineWidth = 2;
      cx.beginPath(); cx.moveTo(tx,ty); cx.lineTo(x,y); cx.stroke();
      cx.lineWidth = 1; cx.fillStyle = p.c;
      cx.beginPath(); cx.arc(x, y, 2.2, 0, 7); cx.fill();
      cx.globalAlpha = .22*f; cx.beginPath(); cx.arc(x, y, 5.5, 0, 7); cx.fill();
      return true;
    });
    rings = rings.filter(r => {
      r.t += dt; const k = r.t/(r.big ? 1.1 : .8); if (k >= 1) return false;
      cx.globalAlpha = (1-k)*(r.big ? .8 : .5)*Math.max(fade(r.x), r.big ? .5 : 0);
      cx.strokeStyle = r.c; cx.lineWidth = r.big ? 1.6 : 1;
      cx.beginPath(); cx.arc(r.x, r.y, 4 + k*(r.big ? 30 : 16), 0, 7); cx.stroke();
      return true;
    });
    cx.globalAlpha = 1; cx.lineWidth = 1;
    if (running) requestAnimationFrame(frame);
  }
  function start(){
    if (running || still.matches || document.hidden) return;
    running = true; last = 0; requestAnimationFrame(frame);
  }
  function stop(){ running = false; }
  function paint(){ if (!running) { packets = []; rings = []; last = 0; frame(performance.now()); } }

  colors(); build();
  if (still.matches) paint(); else { start(); for (let i = 0; i < 8; i++) spawn(); }
  let rt;
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { build(); paint(); }, 150); });
  document.addEventListener("visibilitychange", () => document.hidden ? stop() : start());
  still.addEventListener?.("change", () => {
    document.querySelectorAll("svg.logo").forEach(s => still.matches ? s.pauseAnimations?.() : s.unpauseAnimations?.());
    if (still.matches) { stop(); paint(); } else start();
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { colors(); paint(); });
  if (still.matches) document.querySelectorAll("svg.logo").forEach(s => s.pauseAnimations?.());
  return {burst};
})();

const PV2_LISTA = { id:"pv2-lista", t:"Lista PV2", layer:"Gabarito", kind:"quiz", jl:"Lista",
 intro:"A <b>Lista de exercícios PV2 (passadas)</b> do Prof. Edson, com o gabarito oficial e um comentário em cada questão. As de 36 e 37 são de resolver (na folha de gabarito elas aparecem como 42 e 43). Selo rosa: segundo quem fez a PV2 da outra turma, a <b>primeira questão da prova</b> foi praticamente igual às do cabeçalho IPv4 (32 a 35).",
 qs:[
 {q:"A sub-rede de uma planta industrial precisa acomodar no máximo 14 dispositivos simultâneos. Qual a máscara VLSM que atende a essa demanda com máxima economia de endereços?", o:["255.255.255.224","255.255.255.192","255.255.255.240","255.255.255.248","Nenhuma das anteriores"], a:2,
  e:"14 hosts + rede + broadcast = 16 endereços = 2<sup>4</sup> → 4 bits de host → /28 = <b>255.255.255.240</b> (16 endereços, 14 hosts). A /29 (248) só dá 6 hosts; a /27 (224) daria 30, desperdiçando."},
 {q:"Durante o planejamento de uma rede de telecomunicações, fazendo uso de VLSM, você precisou configurar um link WAN ponto-a-ponto entre dois roteadores. Qual é a máscara mais eficiente para economizar endereços IP nesse link específico?", o:["/8","/32","/16","/24","Nenhuma das anteriores"], a:4,
  e:"Um enlace ponto a ponto tem só 2 hosts (um roteador em cada ponta): a máscara certa é <b>/30</b> (4 endereços: rede, 2 hosts, broadcast). Como /30 não está entre as opções, a resposta é <b>e</b>. A /32 é um endereço único, sem espaço para dois roteadores."},
 {q:"Considere a sub-rede 10.0.0.128/26, resultante de um esquema VLSM. Qual é o endereço de broadcast correspondente a essa sub-rede?", o:["10.0.0.192","10.0.0.190","10.0.0.191","10.0.0.255","Nenhuma das anteriores"], a:2,
  e:"/26 → bloco de 64. A sub-rede vai de 10.0.0.128 a 10.0.0.191: o broadcast é o último, <b>10.0.0.191</b>. O .190 é o último host e o .192 já é a próxima sub-rede."},
 {q:"O uso da técnica VLSM (Variable Length Subnet Mask) trouxe como principal benefício para a Internet global:", o:["Eliminação do uso de portas lógicas TCP e UDP na camada de transporte.","Redução do desperdício de endereços IP.","Garantia de diminuição da latência nas transmissões.","Possibilidade de coexistência de redes IPv4 e redes IPv6.","Nenhuma das anteriores"], a:1,
  e:"Com VLSM cada sub-rede recebe uma máscara do tamanho da sua necessidade (um /30 para o enlace WAN, um /25 para a LAN grande), em vez de todas com o mesmo tamanho. Resultado: <b>menos endereços desperdiçados</b>."},
 {q:"Fazendo uso de VLSM, deseja-se dividir o bloco de endereços IP 192.168.10.0/24 para atender a três departamentos: Desenvolvimento: 60 hosts, Infraestrutura: 28 hosts e Recursos Humanos: 12 hosts. Considerando a alocação de endereços otimizada da maior para a menor rede, qual será o endereço de rede/máscara atribuídos ao departamento de Infraestrutura?", o:["192.168.10.64/27","192.168.10.128/27","192.168.10.64/26","192.168.10.32/28","Nenhuma das anteriores"], a:0,
  e:"Da maior para a menor: Desenvolvimento (60 → 64 endereços, /26) fica com 192.168.10.0 a .63. Infraestrutura (28 → 32 endereços, /27) começa logo depois: <b>192.168.10.64/27</b> (.64 a .95). RH (12 → 16, /28) fica com 192.168.10.96/28."},
 {q:"O protocolo ICMP (Internet Control Message Protocol) opera integrado a qual camada do Modelo OSI e qual é o seu principal propósito na rede?", o:["Camada de Transporte (Camada 4), garantindo a entrega confiável e retransmissão de segmentos perdidos.","Camada de Rede (Camada 3), atuando no fornecimento de mensagens de erros e mensagens de controle operacional sobre o envio de pacotes.","Camada Física (Camada 1), controlando a modulação elétrica das portas de fibra óptica.","Camada de Aplicação (Camada 7), gerenciando bancos de dados de sites web remotos.","Nenhuma das anteriores"], a:1,
  e:"O ICMP é companheiro do IP, na <b>camada de rede</b>: leva mensagens de <b>erro</b> (destino inalcançável, TTL expirado) e de <b>controle</b> (echo request/reply do ping). As mensagens ICMP vão encapsuladas dentro de pacotes IP."},
 {q:"Quando um pacote IPv4 precisa ser fragmentado, porque excede a MTU da interface, quais dos campos do cabeçalho IPv4 indicados são alterados ou utilizados para gerenciar a remontagem correta desse pacote no destino?", o:["Total Length, Version e Padding.","TTL, Protocol e Type of Service.","Identification, Flags e Fragment Offset.","Source IP, Destination IP e IHL.","Nenhuma das anteriores"], a:2,
  e:"<b>Identificação</b>: todos os fragmentos do mesmo pacote têm o mesmo número. <b>Flags</b>: o bit MF diz se ainda vêm fragmentos. <b>Deslocamento do fragmento</b>: a posição dos dados no pacote original, em unidades de 8 bytes."},
 {q:"Um cabeçalho típico do protocolo IPv4 possui um tamanho típico de quantos bytes?", o:["128 bytes","40 bytes","20 bytes","60 bytes","Nenhuma das anteriores"], a:2, tag:"parecida",
  e:"Sem opções, o cabeçalho IPv4 tem <b>20 bytes</b> (HLEN = 5 palavras de 4 bytes). Com opções, chega a 60 (HLEN = 15). 40 bytes é o cabeçalho fixo do IPv6."},
 {q:"O que ocorre quando um roteador decrementa o campo TTL de um pacote IPv4 e este valor atinge o valor 0?", o:["O valor zero indica que o pacote chegou ao seu destino final; o pacote é lido pela interface do dispositivo.","O pacote é encaminhado para o próximo salto, utilizando o caminho de menor custo (custo zero).","O pacote é descartado pelo roteador e uma mensagem ICMP é enviada ao host origem do pacote.","O pacote é enviado à camada de transporte imediatamente, para verificação de possíveis erros.","Nenhuma das anteriores"], a:2,
  e:"Cada roteador tira 1 do TTL. Se chegar a 0, o pacote é <b>descartado</b> e o roteador manda à origem um ICMP <b>Time Exceeded</b> (tipo 11). Isso evita que um pacote fique rodando para sempre num laço de roteamento; é também o princípio do traceroute."},
 {q:"Qual é a utilidade do campo Type of Service (ToS) no cabeçalho básico do IPv4?", o:["Auxiliar o processo de fragmentação e remontagem do pacote, se necessário.","Indicar ao roteador destino o “comprimento” do pacote IPv4.","Identificar o número de saltos máximo permitido para o pacote.","Implementar mecanismos de Qualidade de Serviço (QoS)","Nenhuma das anteriores"], a:3,
  e:"O Tipo de Serviço (8 bits) marca a <b>prioridade</b> do pacote, base do <b>QoS</b> (hoje chamado de Serviços Diferenciados). Fragmentação é Identificação/Flags/Deslocamento; comprimento é o Comprimento Total; saltos é o TTL."},
 {q:"Com relação ao cabeçalho base do IPv6, é correto afirmar:", o:["Possui comprimento fixo de 40 bytes","Possui comprimento variável de 40 bytes a 60 bytes.","Possui comprimento variável de 20 bytes a 60 bytes.","Possui comprimento fixo de 128 bytes","Nenhuma das anteriores"], a:0,
  e:"O cabeçalho base do IPv6 é <b>fixo, com 40 bytes</b> e só 8 campos. As opções foram para os cabeçalhos de extensão. 20 a 60 bytes é o cabeçalho IPv4; 128 é o número de <b>bits</b> do endereço IPv6."},
 {q:"Qual das seguintes alternativas apresenta a forma mais compactada válida do endereço IPv6: 2001:0db8:0000:0000:0000:0000:1428:57ab?", o:["2001:db8:1428:57ab","2001:db8::1428:57ab","2001:db8::0::1428:57ab","2001:0db8:0:0:0:0:1428:57ab","Nenhuma das anteriores"], a:1,
  e:"Tira os zeros à esquerda (0db8 → db8) e troca a sequência de grupos 0000 por <b>::</b>, uma vez só: <b>2001:db8::1428:57ab</b>. A a) perdeu os zeros sem o ::; a c) usa :: duas vezes (ambíguo); a d) não está compactada ao máximo."},
 {q:"Uma das mudanças conceituais marcantes ocorridas no IPv6, em relação ao IPv4, foi a alteração no esquema de endereçamento das redes. Um tipo de endereço padrão nas redes IPv4 foi excluído no endereçamento IPv6. Qual tipo de endereço IPv4 deixou de existir no IPv6?", o:["Endereço Multicast","Endereço Unicast","Endereço de Broadcast","Endereço de Loopback","Nenhuma das anteriores"], a:2,
  e:"O IPv6 <b>não tem broadcast</b>. Os tipos são unicast, anycast e multicast; o que antes era feito por broadcast passa a usar multicast (por exemplo, FF02::1 = todos os nós do enlace). Loopback continua existindo (::1)."},
 {q:"Qual prefixo identifica endereços Link-Local, endereços atribuídos automaticamente pelo sistema de seu dispositivo?", o:["FE80::/10","FC00::/7","2000::/3","FF00::/8","Nenhuma das anteriores"], a:0,
  e:"<b>FE80::/10</b> = link-local, configurado automaticamente e válido só no enlace (não é roteado). 2000::/3 = global unicast (público); FC00::/7 = unique local (privado); FF00::/8 = multicast."},
 {q:"O que ocorre quando um roteador intermediário recebe um pacote IPv6 cujo tamanho excede a MTU (Maximum Transmission Unit) da interface de saída?", o:["O pacote é colocado em uma fila de espera infinita até que a MTU dessa interface seja alterada.","O roteador altera o cabeçalho base do pacote diminuindo seu tamanho, de modo a ser compatível com a MTU da interface de saída.","O roteador realiza a fragmentação do pacote, gerando pacotes de tamanhos compatíveis com a MTU da interface de saída.","O roteador envia o pacote através da sua interface de maior MTU.","Nenhuma das alterações."], a:4,
  e:"No IPv6, roteador <b>não fragmenta</b>: a fragmentação e a remontagem acontecem só na origem e no destino. O roteador <b>descarta</b> o pacote e avisa a origem com um ICMPv6 <b>Packet Too Big</b> (é a descoberta do Path MTU). Nenhuma alternativa diz isso → <b>e</b>."},
 {q:"A Tríade CIA (Confidencialidade, Integridade e Disponibilidade) representa os três pilares fundamentais da segurança da informação. Qual das seguintes alternativas descreve uma quebra direta do pilar Integridade?", o:["Um ataque de negação de serviço (DoS) deixa o site de e-commerce de uma empresa fora do ar por horas.","Um usuário esquece sua senha de acesso e é bloqueado temporariamente pelo sistema corporativo.","Um ataque intercepta e altera o valor de uma transação financeira antes que ela chegue ao banco.","Um funcionário não autorizado consegue ler um arquivo confidencial de recursos humanos.","Nenhuma das anteriores"], a:2,
  e:"<b>Integridade</b> = o dado não pode ser alterado sem autorização. Alterar o valor da transação quebra a integridade. O DoS quebra a <b>disponibilidade</b>; ler o arquivo sem permissão quebra a <b>confidencialidade</b>."},
 {q:"Um ataque do tipo Ransomware causa um impacto severo nas organizações. Qual ação maliciosa define a operação típica desse tipo de malware?", o:["Exibir anúncios publicitários irritantes em pop-ups a cada clique feito pelo usuário no navegador.","Criptografar os arquivos locais do sistema e exigir o pagamento de um resgate (geralmente em criptomoedas) para fornecer a chave de liberação.","Monitorar e registrar secretamente todas as teclas digitadas no teclado físico para capturar credenciais bancárias.","Formatar completamente o disco rígido apagando os registros master de inicialização sem deixar avisos.","Nenhuma das anteriores"], a:1,
  e:"Ransomware <b>sequestra</b> os dados (criptografa) e cobra resgate. Anúncios = adware; registrar teclas = spyware (keylogger)."},
 {q:"Qual é a principal diferença entre um vírus e um worm (verme) em termos de propagação?", o:["O worm se replica de forma independente explorando vulnerabilidades, enquanto o vírus requer a execução de um arquivo pelo usuário.","O vírus ataca apenas o hardware, enquanto o worm ataca exclusivamente softwares de rede.","O vírus criptografa os dados para resgate, enquanto o worm apenas espiona o usuário.","Worms são sempre inofensivos e vírus são sempre destrutivos.","Nenhuma das anteriores"], a:0,
  e:"O <b>vírus</b> vem anexado a um executável e precisa que alguém o execute. O <b>worm</b> se espalha <b>sozinho</b> pela rede, explorando vulnerabilidades, e deixa a rede lenta."},
 {q:"Um ataque de negação de serviço distribuído (DDoS) utiliza qual estrutura para sobrecarregar um alvo?", o:["A manipulação de mecanismos de busca para direcionar usuários a sites falsos.","Um único supercomputador capaz de gerar trilhões de requisições por segundo.","Uma botnet composta por vários hosts infectados chamados de zumbis.","O uso de engenharia social para convencer administradores a desligarem os servidores.","Nenhuma das anteriores"], a:2,
  e:"DDoS = muitas origens ao mesmo tempo: uma <b>botnet</b> de máquinas infectadas (<b>zumbis</b>) comandadas pelo atacante. Manipular busca é envenenamento de SEO; um único computador seria DoS."},
 {q:"Um ataque de 'Phishing' é caracterizado principalmente por:", o:["A interceptação física de cabos de fibra óptica para captura de dados.","A quebra de senhas de redes Wi-Fi através de ataques de dicionário.","A criação de backdoors em sistemas operacionais através de rootkits.","O uso de e-mails fraudulentos disfarçados de fontes confiáveis para enganar o usuário.","Nenhuma das anteriores"], a:3,
  e:"Phishing = <b>e-mail falso</b> que se passa por fonte confiável para fazer o usuário clicar num link, instalar malware ou entregar dados."},
 {q:"Qual dispositivo de segurança tem como função principal detectar, registrar e relatar tentativas de ataque, sem necessariamente bloqueá-los de forma ativa?", o:["VPN (Virtual Private Network)","IDS (Intrusion Detection System)","Nenhuma das anteriores.","Firewall ou ACLs","IPS (Intrusion Prevention System)"], a:1,
  e:"<b>IDS</b> = detecção: detecta, registra e relata, mas <b>não impede</b>. O <b>IPS</b> = prevenção: bloqueia. Firewall filtra por regras; VPN cria um túnel criptografado. Na lista as letras estão nessa ordem mesmo, com a c) no meio."},
 {q:"Uma prática para proteger dados corporativos confidenciais que trafegam através da internet pública é o uso de:", o:["Protocolos de roteamento dinâmico sem autenticação baseados em RIPv1.","Configuração do navegador de internet local no modo de navegação anônima.","Cabos de rede trançados sem blindagem estendidos pelas vias urbanas públicos.","VPN (Virtual Private Network) corporativa com criptografia ponta a ponta.","Nenhuma das anteriores"], a:3,
  e:"A <b>VPN</b> cria um túnel criptografado sobre a internet pública. Navegação anônima só não guarda histórico local; não protege o tráfego."},
 {q:"Os endereços IPv6 são formados por 128 bits, representados na forma hexadecimal, agrupados em 8 campos de 4 bytes cada campo.", o:VF, a:1,
  e:"São 8 campos de <b>16 bits (2 bytes)</b>, cada um com 4 dígitos hexadecimais: 8 × 16 = 128. Com 4 bytes por campo seriam 256 bits."},
 {q:"Uma rede IP que necessite endereçar 30 hosts poderá fazer uso de uma máscara /30.", o:VF, a:1,
  e:"/30 = 4 endereços, só <b>2 hosts</b> (serve para enlace ponto a ponto). Para 30 hosts, /27 (32 endereços, 30 hosts)."},
 {q:"Uma rede IP que necessite endereçar 128 hosts poderá fazer uso de uma máscara /25.", o:VF, a:1,
  e:"/25 = 128 endereços, mas só <b>126 hosts</b> (tirando rede e broadcast). Para 128 hosts precisa de /24."},
 {q:"O endereço de rede, utilizado para identificar uma rede, deve ser colocado na interface do roteador que esta rede está conectada.", o:VF, a:1,
  e:"O endereço de rede (o primeiro da faixa) <b>não</b> vai em interface nenhuma: ele só identifica a rede. A interface do roteador recebe um endereço de <b>host</b> (normalmente o .1), que vira o gateway da rede."},
 {q:"Uma rede IPv4 necessita de endereçar 56 hosts, no máximo. A máscara de rede /24 pode ser utilizada?", o:VF, a:0,
  e:"<b>Pode</b>: /24 tem 254 hosts, mais que 56. Só não é a mais econômica (a /26, com 62 hosts, bastaria). A pergunta é se pode, não se é a melhor."},
 {q:"Uma placa de rede com endereço 192.168.10.10/25 pertence à rede 192.168.10.0/25, com endereço de broadcast 192.168.10.255.", o:VF, a:1,
  e:"A rede está certa (192.168.10.0/25 vai de .0 a .127), mas o broadcast é <b>192.168.10.127</b>. O .255 é o broadcast da outra metade (192.168.10.128/25)."},
 {q:"Uma rede /22 permite endereçar no máximo 1024 hosts.", o:VF, a:1,
  e:"/22 = 10 bits de host = 1024 <b>endereços</b>, mas <b>1022 hosts</b> (tirando rede e broadcast)."},
 {q:"Dentre as várias características que diferem o endereço IPv6 do endereço IPv4 tem-se no IPv6 um maior cabeçalho, tornando assim seu processamento mais complexo.", o:VF, a:1,
  e:"O cabeçalho é maior (40 bytes contra 20), mas o processamento fica <b>mais simples</b>: tamanho fixo, só 8 campos, sem checksum e sem fragmentação nos roteadores. É a parte que o gabarito risca."},
 {q:"O endereço IPv6 2001:cafe::abcd é um endereço IPv6 válido; já o endereço 2001:cafe::efgh é um endereço inválido.", o:VF, a:0,
  e:"Hexadecimal só vai de 0 a 9 e de <b>a a f</b>. “cafe” e “abcd” são válidos; “efgh” tem g e h, que não existem em hexa."},
 {q:"Com base no cabeçalho IP da figura: o cabeçalho desse pacote possui 5 bytes.", fig:FIG_HDR_L, o:VF, a:1, tag:"parecida",
  e:"HLEN = 5 conta palavras de <b>32 bits (4 bytes)</b>: 5 × 4 = <b>20 bytes</b>."},
 {q:"Com base no cabeçalho IP da figura: o payload (carga útil ou dados) desse pacote é igual a 3500 bytes.", fig:FIG_HDR_L, o:VF, a:1, tag:"parecida",
  e:"3500 é o <b>comprimento total</b> (cabeçalho + dados). Dados = 3500 − 20 = <b>3480 bytes</b>."},
 {q:"Com base no cabeçalho IP da figura: o comprimento total desse pacote é de 1958 bytes.", fig:FIG_HDR_L, o:VF, a:1, tag:"parecida",
  e:"1958 está no campo <b>Identificação</b> (o número que liga os fragmentos de um mesmo pacote). O comprimento total é o campo da primeira linha: <b>3500 bytes</b>."},
 {q:"Com base no cabeçalho IP da figura: este pacote é o último fragmento de um pacote original que foi fragmentado.", fig:FIG_HDR_L, o:VF, a:1, tag:"parecida",
  e:"MF = 0 <b>e</b> deslocamento = 0: não vem nada depois e não veio nada antes. É um pacote <b>inteiro, não fragmentado</b>. O último fragmento teria MF = 0 com deslocamento <b>diferente</b> de 0."},
 {q:"(Resolver) De posse do bloco de endereços 192.168.24.0/22, deseja-se subdividir esse bloco em quatro novas sub-redes. Identifique a nova máscara a ser utilizada e os endereços de rede de cada uma dessas quatro novas sub-redes.", o:OPEN_O, a:0, e:OPEN_E,
  open:`<p>4 sub-redes = 2<sup>2</sup> → +2 bits: /22 + 2 = <b>/24</b> (255.255.255.0).</p>
  ${tbl(["Sub-rede","Endereço de rede","Faixa de hosts","Broadcast"],[["SR1","192.168.24.0/24",".24.1 a .24.254","192.168.24.255"],["SR2","192.168.25.0/24",".25.1 a .25.254","192.168.25.255"],["SR3","192.168.26.0/24",".26.1 a .26.254","192.168.26.255"],["SR4","192.168.27.0/24",".27.1 a .27.254","192.168.27.255"]])}
  <p>A /22 cobre 192.168.24.0 a 192.168.27.255 (bloco de 4 no 3º octeto). Cada /24 ocupa um valor do 3º octeto.</p>`},
 {q:"(Resolver) Dado o bloco de endereços 200.10.10.0/24, deseja-se dividir o mesmo em cinco sub-redes, para atender às seguintes exigências: SR1 – 20 hosts; SR2 – 40 hosts; SR3 – 50 hosts; SR4 – 50 hosts e SR5 – 16 hosts. Defina um esquema de endereçamento para essas redes, indicando a máscara e o endereço de rede de cada uma das sub-redes.", o:OPEN_O, a:0, e:OPEN_E,
  open:`<p>VLSM: ordene da maior para a menor e dê a cada uma a menor potência de 2 que caiba hosts + 2.</p>
  ${tbl(["Sub-rede","Hosts","Endereços","Rede/máscara","Broadcast"],[["SR3","50","64","200.10.10.0/26","200.10.10.63"],["SR4","50","64","200.10.10.64/26","200.10.10.127"],["SR2","40","64","200.10.10.128/26","200.10.10.191"],["SR1","20","32","200.10.10.192/27","200.10.10.223"],["SR5","16","32","200.10.10.224/27","200.10.10.255"]])}
  <p>Atenção à SR5: 16 hosts + 2 = 18 endereços, que não cabem em 16 → precisa de 32 (/27). O bloco fecha exato: 64+64+64+32+32 = 256.</p>`},
]};

/* ---------- PV2: lista de sub-redes (aula 07) ---------- */
const SR10 = "Enlaces WAN da topologia (seriais): R1–R2, R1–R11, R1–R3, R2–R21, R2–R22, R3–R31, R3–R32\nLAN 10 (R1) · LAN 20 (R2) · LAN 30 (R3) · LAN 111 (R11) · LAN 211/212 (R21)\nLAN 221 (R22) · LAN 311/312 (R31) · LAN 321/322 (R32)";
const PV2_SUB = { id:"pv2-sub", t:"Lista de sub-redes", layer:"Aula 07", kind:"quiz", jl:"Sub-redes",
 intro:"A <b>Lista de exercícios: IPv4 – cálculo de sub-redes</b> (aula 07). A lista não tem gabarito; as respostas aqui foram calculadas e conferidas. Os itens de conta viraram múltipla escolha; as tabelas (exercícios 3c, 8, 9 e 10) são abertas, com a resolução completa para você comparar. No fim, a Atividade 7 da aula (VLSM do ENADE).",
 qs:[
 {q:"1a) A empresa recebeu o bloco 197.15.22.0/24 e quer 8 sub-redes. Qual máscara usar nessas sub-redes?", o:["255.255.255.224 (/27)","255.255.255.240 (/28)","255.255.255.192 (/26)","255.255.255.248 (/29)","Nenhuma das anteriores"], a:0,
  e:"8 = 2<sup>3</sup> → empresta 3 bits: /24 + 3 = <b>/27</b>. No último octeto, 11100000 = 128 + 64 + 32 = 224."},
 {q:"1b) Com essa divisão (197.15.22.0/24 em 8), quantos endereços no total há em cada sub-rede?", o:["32","30","64","8","Nenhuma das anteriores"], a:0,
  e:"/27 deixa 5 bits de host: 2<sup>5</sup> = <b>32 endereços</b>."},
 {q:"1c) E quantos endereços de host em cada sub-rede?", o:["32","30","62","6","Nenhuma das anteriores"], a:1,
  e:"32 endereços − rede − broadcast = <b>30 hosts</b>."},
 {q:"1d) 197.15.22.63 é um endereço de host válido para esta empresa?", o:["Sim, é um host da 2ª sub-rede","Não: é o broadcast da 2ª sub-rede (197.15.22.32/27)","Não: é o endereço de rede da 3ª sub-rede","Nenhuma das anteriores"], a:1,
  e:"Blocos de 32: .0–.31, <b>.32–.63</b>, .64–.95… O .63 é o último do 2º bloco, ou seja, o <b>broadcast</b> de 197.15.22.32/27. Não pode ir num host."},
 {q:"1e) 197.15.22.160 é um endereço de host válido para esta empresa?", o:["Sim, é um host da 6ª sub-rede","Não: é o broadcast da 5ª sub-rede","Não: é o endereço de rede da 6ª sub-rede (197.15.22.160/27)","Nenhuma das anteriores"], a:2,
  e:"160 = 5 × 32: é o <b>início</b> de um bloco (.160–.191), ou seja, o endereço de <b>rede</b> da 6ª sub-rede. O broadcast da 5ª é o .159."},
 {q:"2a) A máscara 255.255.240.0 foi aplicada ao bloco 10.0.0.0/16. Quantas sub-redes foram criadas?", o:["4","8","16","4096","Nenhuma das anteriores"], a:2,
  e:"255.255.240.0 = /20. De /16 para /20 são 4 bits de sub-rede: 2<sup>4</sup> = <b>16 sub-redes</b>."},
 {q:"2b) Quantos endereços estão disponíveis para hosts em cada sub-rede?", o:["4096","4094","254","16","Nenhuma das anteriores"], a:1,
  e:"/20 deixa 12 bits de host: 2<sup>12</sup> = 4096 endereços, menos 2 = <b>4094 hosts</b>."},
 {q:"2c) Qual o endereço de rede da segunda sub-rede criada?", o:["10.0.1.0","10.0.16.0","10.0.32.0","10.0.15.0","Nenhuma das anteriores"], a:1,
  e:"240 no 3º octeto → bloco de 256 − 240 = 16. Sub-redes: 10.0.0.0, <b>10.0.16.0</b>, 10.0.32.0…"},
 {q:"2d) Qual o endereço de broadcast da segunda sub-rede criada?", o:["10.0.31.255","10.0.16.255","10.0.32.255","10.0.15.255","Nenhuma das anteriores"], a:0,
  e:"A 2ª sub-rede vai de 10.0.16.0 até antes da 3ª (10.0.32.0): broadcast = <b>10.0.31.255</b>."},
 {q:"2e) O endereço 10.0.63.255 identifica rede, broadcast ou host?", o:["Rede","Host","Broadcast","Nenhuma das anteriores"], a:2,
  e:"Blocos de 16 no 3º octeto: …, 32–47, <b>48–63</b>. 10.0.63.255 é o último endereço de 10.0.48.0/20: <b>broadcast</b>."},
 {q:"3a) A Classical Academy recebeu 172.16.0.0/21 e quer 8 sub-redes, uma por filial. Qual a máscara?", o:["255.255.255.0 (/24)","255.255.248.0 (/21)","255.255.252.0 (/22)","255.255.255.128 (/25)","Nenhuma das anteriores"], a:0,
  e:"8 = 2<sup>3</sup> → /21 + 3 = <b>/24</b> = 255.255.255.0."},
 {q:"3b) Quantos hosts utilizáveis existem em cada sub-rede?", o:["254","256","2046","126","Nenhuma das anteriores"], a:0,
  e:"/24 → 8 bits de host: 256 − 2 = <b>254</b>."},
 {q:"3c) (Tabela) Complete, para as 8 sub-redes de 172.16.0.0/21: endereço da sub-rede, intervalo dos hosts e broadcast.", o:OPEN_O, a:0, e:OPEN_E,
  open:tbl(["Sub-rede","Endereço","Intervalo de hosts","Broadcast"],[0,1,2,3,4,5,6,7].map(i => [i+1,`172.16.${i}.0`,`172.16.${i}.1 a 172.16.${i}.254`,`172.16.${i}.255`]))},
 {q:"4a) Um bloco /8 deve ser dividido em no mínimo 515 sub-redes. Qual a máscara?", o:["/17","/18","/19","/10","Nenhuma das anteriores"], a:1,
  e:"2<sup>9</sup> = 512 não basta; 2<sup>10</sup> = 1024 ≥ 515. São 10 bits de sub-rede: /8 + 10 = <b>/18</b> (255.255.192.0)."},
 {q:"4b) Após essa divisão, quantos endereços no total e quantos de hosts há em cada sub-rede?", o:["16384 endereços, 16382 hosts","32768 endereços, 32766 hosts","8192 endereços, 8190 hosts","1024 endereços, 1022 hosts","Nenhuma das anteriores"], a:0,
  e:"/18 deixa 14 bits de host: 2<sup>14</sup> = <b>16384</b> endereços e <b>16382</b> hosts."},
 {q:"4c) Usando 10.0.0.0/8 como exemplo (a lista não fixa o bloco), quais as três primeiras sub-redes?", o:["10.0.0.0, 10.0.64.0 e 10.0.128.0","10.0.0.0, 10.1.0.0 e 10.2.0.0","10.0.0.0, 10.0.32.0 e 10.0.64.0","10.0.0.0, 10.64.0.0 e 10.128.0.0","Nenhuma das anteriores"], a:0,
  e:"/18 → o 3º octeto tem 2 bits de rede (máscara 192), bloco de 64: <b>10.0.0.0, 10.0.64.0, 10.0.128.0</b>, 10.0.192.0, 10.1.0.0…"},
 {q:"5a) Dado 192.168.10.64/26, quantos endereços de host há nessa rede?", o:["64","62","30","126","Nenhuma das anteriores"], a:1,
  e:"/26 → 6 bits de host: 64 − 2 = <b>62 hosts</b>."},
 {q:"5b) Para dividir 192.168.10.64/26 em quatro novas sub-redes, qual a nova máscara?", o:["/27","/28","/29","/30","Nenhuma das anteriores"], a:1,
  e:"4 = 2<sup>2</sup> → /26 + 2 = <b>/28</b> (255.255.255.240), 16 endereços cada."},
 {q:"5c) Quais os endereços de rede dessas quatro sub-redes?", o:["192.168.10.64, .80, .96 e .112","192.168.10.64, .96, .128 e .160","192.168.10.0, .16, .32 e .48","192.168.10.64, .72, .80 e .88","Nenhuma das anteriores"], a:0,
  e:"Começa no .64 e anda de 16 em 16: <b>.64, .80, .96, .112</b>. A última termina no .127, o fim do /26 original."},
 {q:"6a) Um bloco /24 deve ser dividido para que cada sub-rede acomode até 32 hosts. Qual a máscara?", o:["/27 (255.255.255.224)","/26 (255.255.255.192)","/28 (255.255.255.240)","/25 (255.255.255.128)","Nenhuma das anteriores"], a:1, flag:"Pegadinha do 32",
  e:"32 hosts + rede + broadcast = 34 endereços. A /27 tem 32 endereços, mas só <b>30 hosts</b>: não cabe. Precisa de 64 endereços → <b>/26</b> (62 hosts). Se o professor quis dizer “32 endereços”, seria /27."},
 {q:"6b) Com essa nova máscara, quantas sub-redes foram criadas?", o:["8","4","2","16","Nenhuma das anteriores"], a:1,
  e:"De /24 para /26 são 2 bits: 2<sup>2</sup> = <b>4 sub-redes</b> (de 64 endereços)."},
 {q:"6c) Quais os endereços das sub-redes criadas (no 4º octeto)?", o:[".0, .64, .128 e .192",".0, .32, .64, .96, .128, .160, .192 e .224",".0 e .128",".1, .65, .129 e .193","Nenhuma das anteriores"], a:0,
  e:"Blocos de 64: <b>.0, .64, .128, .192</b>. A d) lista o primeiro host de cada uma, não a rede."},
 {q:"7a) O bloco 192.168.0.0/26 será dividido em oito sub-redes. Qual a máscara de cada uma?", o:["/29 (255.255.255.248)","/28 (255.255.255.240)","/30 (255.255.255.252)","/27 (255.255.255.224)","Nenhuma das anteriores"], a:0,
  e:"8 = 2<sup>3</sup> → /26 + 3 = <b>/29</b>: 8 endereços (6 hosts) em cada."},
 {q:"7b) Quais os endereços de rede e de broadcast da segunda sub-rede criada?", o:["Rede 192.168.0.8, broadcast 192.168.0.15","Rede 192.168.0.16, broadcast 192.168.0.23","Rede 192.168.0.8, broadcast 192.168.0.16","Rede 192.168.0.4, broadcast 192.168.0.7","Nenhuma das anteriores"], a:0,
  e:"Blocos de 8: .0–.7, <b>.8–.15</b>, .16–.23… A 2ª sub-rede é 192.168.0.8, com broadcast .15."},
 {q:"7c) Qual a faixa de endereços de hosts da última sub-rede criada?", o:["192.168.0.57 a 192.168.0.62","192.168.0.56 a 192.168.0.63","192.168.0.49 a 192.168.0.54","192.168.0.249 a 192.168.0.254","Nenhuma das anteriores"], a:0,
  e:"A 8ª sub-rede é 192.168.0.56/29 (.56 a .63). Tirando rede (.56) e broadcast (.63): <b>.57 a .62</b>. A b) inclui a rede e o broadcast; a d) esquece que o bloco original é /26 (vai só até .63)."},
 {q:"8) (Tabela) A empresa XYZ tem 192.168.1.0/24 e cinco departamentos: TIC 30 hosts, Produção 80, Finanças 10, RH 10 e Varejo 56. Defina o prefixo (rede/máscara) de cada departamento.", o:OPEN_O, a:0, e:OPEN_E,

  <p>Da maior para a menor. TIC: 30 hosts cabem exatos numa /27 (32 − 2 = 30). O bloco fecha exato: 128 + 64 + 32 + 16 + 16 = 256.</p>`},
 {q:"9) (Tabela) Dado 200.10.10.0/24, defina máscara e rede para: SR1 20 hosts, SR2 40, SR3 50, SR4 50 e SR5 16. (É a mesma da Lista PV2.)", o:OPEN_O, a:0, e:OPEN_E,

  <p>SR5: 16 + 2 = 18 endereços → /27 (32), não /28.</p>`},
 {q:"10) (Tabela) Provedor DKW TIC: partindo de 172.30.0.0/16, endereçe a topologia (11 LANs e 7 enlaces WAN). Hosts: LAN 10 = 50, LAN 20 = 200, LAN 30 = 130, LAN 111 = 80, LAN 211 = 150, LAN 212 = 200, LAN 221 = 80, LAN 311 = 60, LAN 312 = 200, LAN 321 = 150, LAN 322 = 90.", pre:SR10, o:OPEN_O, a:0, e:OPEN_E,
  open:`<p>Primeiro o tamanho de cada uma: até 126 hosts → /25; de 127 a 254 → /24 (130 e 150 <b>não</b> cabem em /25); até 62 → /26; enlace WAN → /30.</p>

  <p>A ordem entre redes do mesmo tamanho pode mudar; o que importa é alocar da maior para a menor e não sobrepor. Se o professor não contar os enlaces WAN, a tabela termina na LAN 10.</p>`},
 {q:"Atividade 7 da aula (ENADE): 200.10.10.0/24, cinco departamentos: Produção 10, Compras 25, Vendas 40, Pessoal 100 e Pesquisa 8. Os maiores ficam no início do bloco. Dê máscara, rede e broadcast de cada um.", o:OPEN_O, a:0, e:OPEN_E,

const A9_QS = [
 {q:"É um formato válido para um endereço IPv6: ::1", o:["Verdade", "Falso"], a:0,
  e:"::1 é o endereço de loopback do IPv6 (0:0:0:0:0:0:0:1 abreviado com ::)."},
 {q:"Um dos problemas graves do IPv4 é: Sua não implementação nos novos dispositivos e redes que são incorporadas à rede mundial.", o:["Verdade", "Falso"], a:1,
  e:"O IPv4 continua implementado em praticamente todos os dispositivos; o problema grave é o esgotamento de endereços."},
 {q:"É um formato válido para um endereço IPv6: FE80:abcd::abcd::12fe", o:["Verdade", "Falso"], a:1,

 {q:"Considerando um pacote IPv4 com o cabeçalho mostrado na figura. O tamanho do cabeçalho, em bytes é:", fig:FIG_HDR_A9, o:["6", "20", "24", "50"], a:2,
  e:"IHL = 6 palavras de 32 bits → 6 × 4 = 24 bytes."},
 {q:"Quantos bits existem em um endereço IP versão 4 (IPv4)?", o:["8", "32", "48", "128"], a:1,
  e:"Um endereço IPv4 tem 4 octetos = 32 bits."},
 {q:"Um pacote IP com carga útil de 16384 bytes deverá ser encapsulada em quadros Ethernet para sua transmissão pela rede. Considerando que a MTU da interface é de 1500 bytes, quantos quadros Ethernet serão necessários para a transmissão desse pacote? Obs.: considere que o IP trabalha com cabeçalho padrão (20 bytes).", o:["2", "4", "8", "12"], a:3,
  e:"Cada fragmento leva no máximo 1500 − 20 = 1480 bytes de dados. 16384 / 1480 = 11,07 → 12 fragmentos (11 × 1480 = 16280; o último leva 104 bytes)."},
 {q:"Dentre as várias características que diferem o endereço IPv6 do endereço IPv4 tem-se: Número maior de bits, proporcionando um número bem maior de endereços em cada rede.", o:["Verdade", "Falso"], a:0,
  e:"IPv6 usa 128 bits contra 32 do IPv4."},
 {q:"Considerando um pacote IPv4 com o cabeçalho mostrado na figura. O tamanho do payload (dados), em bytes é:", fig:FIG_HDR_A9, o:["255", "1020", "1024", "1044"], a:1,
  e:"Comprimento total (1044) − cabeçalho (24) = 1020 bytes."},
 {q:"Considerando um pacote IPv4 com o cabeçalho mostrado na figura. O tamanho total do pacote IP, em bytes, é:", fig:FIG_HDR_A9, o:["255", "1024", "1044", "8352"], a:2,
  e:"É o valor do campo Comprimento Total (Total Length), que já é medido em bytes."},
 {q:"Qual protocolo, que contém diversas mensagem padronizadas, e que podem ser utilizadas pelos dispositivos de rede para enviar informações de controle e/ou possíveis erros.", o:["IP", "TCP", "UDP", "ICMP"], a:3,
  e:"O ICMP (Internet Control Message Protocol) transporta mensagens de controle e erro (ex.: echo request/reply, destination unreachable)."},
 {q:"É um formato válido para um endereço IPv6: 2001:bce4:0:0:16:f2ff:fffe:34e1", o:["Verdade", "Falso"], a:0,
  e:"São 8 grupos de até 4 dígitos hexadecimais válidos; zeros à esquerda podem ser omitidos."},
 {q:"Dentre as várias características que diferem o endereço IPv6 do endereço IPv4 tem-se: Uma mesma placa pode possuir diferentes tipos de endereço IPv6.", o:["Verdade", "Falso"], a:0,
  e:"Uma interface IPv6 normalmente tem vários endereços ao mesmo tempo (link-local, global unicast, multicast etc.)."},
 {q:"Um dos problemas graves do IPv4 é: Um protocolo ultrapassado, uma vez que os novos protocolos de enlace se tornaram incompatíveis com ele.", o:["Verdade", "Falso"], a:1,
  e:"O IPv4 funciona sobre os protocolos de enlace atuais (Ethernet, Wi-Fi etc.); o problema é a falta de endereços."},
 {q:"Quantos bits existem em um endereço IP versão 6 (IPv6)?", o:["8", "32", "48", "128"], a:3,
  e:"Um endereço IPv6 tem 128 bits (8 grupos de 16 bits)."},
 {q:"É um formato válido para um endereço IPv6: 2001:db8:abcd::efgh", o:["Verdade", "Falso"], a:1,
  e:"'g' e 'h' não são dígitos hexadecimais (só 0-9 e a-f)."},
 {q:"Considerando um pacote IPv4 com o cabeçalho mostrado na figura. O host de onde o pacote foi enviado tem como endereço:", fig:FIG_HDR_A9, o:["200.20.2.0", "200.20.2.2", "200.20.4.0", "200.20.4.10"], a:1,
  e:"O campo Endereço de Origem (4ª linha do cabeçalho) é 200.20.2.2."},
 {q:"Dentre as várias características que diferem o endereço IPv6 do endereço IPv4 tem-se: Maior cabeçalho, tornando o processamento do mesmo mais complexo.", o:["Verdade", "Falso"], a:1,
  e:"O cabeçalho IPv6 é fixo (40 bytes) e simplificado (sem checksum, opções em cabeçalhos de extensão), o que torna o processamento mais simples, não mais complexo."},
 {q:"Um dos problemas graves do IPv4 é: Não compatibilidade com a nova versão IPv6, tornando as duas redes (IPv4 e IPV6) totalmente incompatíveis.", o:["Verdade", "Falso"], a:1,
  e:"IPv4 e IPv6 coexistem por mecanismos de transição (pilha dupla, túneis, tradução), e isso não é um 'problema grave do IPv4'."},
 {q:"Um dos problemas graves do IPv4 é: Dificuldade de seu uso em novos serviços que necessitam grande número de dispositivos, tais como aplicações e IoT, por exemplo.", o:["Verdade", "Falso"], a:0,
  e:"Com apenas ~4,3 bilhões de endereços, o IPv4 não comporta a escala de dispositivos de IoT."},
 {q:"Um roteador recebe um pacote (datagrama) IP cuja carga útil (payload) é de 1000 bytes, e deseja enviar o mesmo por uma interface cuja MTU é de 500 bytes. Sabendo que os pacotes IP possuem cabeçalho padrão (20 bytes), qual o número de pacotes enviados, resultante do processo de fragmentação?", o:["2", "3", "4", "5"], a:1,
  e:"Cada fragmento leva até 500 − 20 = 480 bytes de dados (múltiplo de 8). 480 + 480 + 40 = 1000 → 3 pacotes."},
];
const A10_QS = [
 {q:"Um sistema de informação pode ser considerado “seguro” se atende a três requisitos básicos: confidencialidade, integridade e disponibilidade.", o:["Verdade", "Falso"], a:0,
  e:"É a tríade CID (CIA): confidencialidade, integridade e disponibilidade são os pilares da segurança da informação."},
 {q:"Uma empresa deve proteger não somente seus dados críticos, mas também os de seus colaborados e clientes.", o:["Verdade", "Falso"], a:0,
  e:"Dados pessoais de funcionários e clientes também precisam de proteção (inclusive por lei, como a LGPD)."},
 {q:"Trojan, ou cavalo de Tróia, é um tipo de malware que vem anexado à um arquivo inofensivo, que visa realizar operações mal-intencionadas no sistema.", o:["Verdade", "Falso"], a:0,
  e:"O cavalo de Troia se disfarça de (ou vem junto com) um programa/arquivo legítimo para executar ações maliciosas."},
 {q:"São exemplos de recursos utilizados para minimizar os acessos não autorizados ao seu sistema: firewall, antivírus e antispyware.", o:["Verdade", "Falso"], a:0,
  e:"São ferramentas básicas de proteção contra acessos e softwares não autorizados."},
 {q:"DDoS é um tipo de ataque em que diferentes dispositivos, espalhados na internet, atacam de maneira sincronizada um único sistema.", o:["Verdade", "Falso"], a:0,
  e:"Negação de serviço distribuída: muitos dispositivos (geralmente uma botnet) sobrecarregam o mesmo alvo ao mesmo tempo."},
 {q:"Ransomware é um tipo de malwares que visa “abrir” uma porta de entrada para o acesso indevido de um usuário mal-intencionado.", o:["Verdade", "Falso"], a:1,
  e:"Isso descreve um backdoor. O ransomware criptografa/bloqueia os dados e exige um resgate para liberá-los."},
 {q:"Um parâmetro importante na política de segurança de uma organização é o tempo de resposta a um incidente; quanto menor esse tempo, menores serão os impactos negativos causados pelo incidente de segurança.", o:["Verdade", "Falso"], a:0,
  e:"Detectar e responder rápido limita o alcance e o dano de um incidente."},
 {q:"Exploit é um tipo de malware utilizado para rastrear as atividades de um usuário em seu dispositivo.", o:["Verdade", "Falso"], a:1,
  e:"Isso descreve um spyware. Exploit é um código que aproveita uma vulnerabilidade de software para obter acesso ou executar ações."},
 {q:"Chamamos “malware” a qualquer “software malicioso” que pode ser utilizado para comprometer um sistema.", o:["Verdade", "Falso"], a:0,
  e:"Malware = malicious software: vírus, worms, trojans, ransomware, spyware etc."},
 {q:"Denomina-se identidade on-line aos dados que uma pessoa utiliza para se identificar no espaço cibernético.", o:["Verdade", "Falso"], a:0,
  e:"Identidade on-line é o conjunto de informações (usuário, perfis, e-mail etc.) com que a pessoa se apresenta na internet."},
 {q:"A segurança cibernética é o esforço contínuo realizado pelos governos para evitarem a invasão de seus territórios por tropas inimigas.", o:["Verdade", "Falso"], a:1,
  e:"Segurança cibernética é o esforço contínuo para proteger sistemas, redes e dados contra uso não autorizado ou danos, e não defesa territorial militar."},
 {q:"Engenharia social denomina um ataque em que o atacante usa de persuasão para obter informações privilegiadas do atacado.", o:["Verdade", "Falso"], a:0,
  e:"Engenharia social manipula pessoas (persuasão, enganação) para obter informações ou acesso."},
 {q:"Autenticação de dois fatores tem como objetivo filtrar o tráfego que entra e sai de uma rede ligada à internet.", o:["Verdade", "Falso"], a:1,
  e:"Filtrar tráfego é função do firewall. A autenticação de dois fatores exige duas formas de comprovar a identidade (ex.: senha + código)."},
 {q:"As ameaças externas são sempre mais preocupantes, pois possuem, de modo geral, maior potencial de causar danos às informações e recursos da organização.", o:["Verdade", "Falso"], a:1,
  e:"Ameaças internas costumam ter maior potencial de dano, porque quem está dentro já tem acesso e conhece os sistemas. Além disso, 'sempre' torna a afirmação falsa."},
 {q:"Dentre alguns sintomas de que um sistema está infectado destacam-se: diminuição no uso da CPU, aumento na velocidade do computador, modificação de arquivos aleatoriamente, entre outros.", o:["Verdade", "Falso"], a:1,
  e:"Os sintomas são o contrário: aumento no uso da CPU e diminuição da velocidade do computador (a modificação de arquivos é, sim, um sintoma)."},
];

/* ---------- PV2: simulado novo ---------- */
const PV2_SIM = { id:"pv2-sim", t:"Simulado PV2", layer:"Novo", kind:"quiz", grade:2.5, jl:"Simulado",
 intro:"Montado a partir do relato de quem fez a PV2 da outra turma: <b>começa pelo cabeçalho IPv4</b>, muito <b>deslocamento de fragmento</b>, sub-redes e binário, IPv6 e transição, ICMP, umas três de <b>tabela de rotas</b> (matéria da PV1), um bloco de verdadeiro/falso de cibersegurança e uma de criptografia. Termina com as <b>4 abertas</b> que caíram: duas de divisão de rede, o que o ICMP faz e o que o ping faz. São 40 questões novas, de 2,5 pontos.",
 qs:[
 {q:"Considerando o pacote IPv4 cujo cabeçalho aparece na figura, quantos bytes tem o cabeçalho?", fig:FIG_HDR_SA, o:["5 bytes","20 bytes","40 bytes","1500 bytes","Nenhuma das anteriores"], a:1,
  e:"HLEN = 5 palavras de 32 bits (4 bytes): 5 × 4 = <b>20 bytes</b>, o cabeçalho sem opções."},
 {q:"No mesmo pacote, qual o tamanho do payload (dados)?", fig:FIG_HDR_SA, o:["1500 bytes","1480 bytes","1520 bytes","185 bytes","Nenhuma das anteriores"], a:1,
  e:"Comprimento total − cabeçalho = 1500 − 20 = <b>1480 bytes</b>."},
 {q:"O que os campos Flags e Deslocamento do fragmento dizem sobre esse pacote?", fig:FIG_HDR_SA, o:["É um pacote que não foi fragmentado","É o primeiro fragmento de um pacote maior","É um fragmento do meio: ainda vêm fragmentos depois dele","É o último fragmento do pacote original","Nenhuma das anteriores"], a:2,
  e:"MF = 1 → <b>ainda vêm fragmentos</b>. Deslocamento 185 ≠ 0 → <b>não é o primeiro</b>. Então é um fragmento do meio."},
 {q:"A partir de qual byte dos dados originais começa a carga desse fragmento?", fig:FIG_HDR_SA, o:["Byte 185","Byte 1480","Byte 1500","Byte 0","Nenhuma das anteriores"], a:1,
  e:"O deslocamento é contado em blocos de <b>8 bytes</b>: 185 × 8 = <b>1480</b>. Antes dele veio um fragmento com os bytes 0 a 1479."},
 {q:"O campo Protocolo desse pacote vale 17. Isso indica que ele transporta:", fig:FIG_HDR_SA, o:["TCP","ICMP","UDP","OSPF","Nenhuma das anteriores"], a:2,
  e:"Números de protocolo: 1 = ICMP, 6 = TCP, <b>17 = UDP</b>, 89 = OSPF."},
 {q:"Com base no cabeçalho da figura (mesma identificação 7201 da questão anterior): este pacote é o último fragmento de um pacote original que foi fragmentado.", fig:FIG_HDR_SB, o:VF, a:0,
  e:"MF = 0 (não vem mais nada) e deslocamento 370 ≠ 0 (veio coisa antes): é o <b>último fragmento</b>. Compare com a Lista PV2, onde MF = 0 e deslocamento = 0 indicam um pacote inteiro."},
 {q:"Quantos bytes de dados tinha o pacote original, antes da fragmentação?", fig:FIG_HDR_SB, o:["520 bytes","2960 bytes","3480 bytes","3500 bytes","Nenhuma das anteriores"], a:2,
  e:"Antes deste fragmento vieram 370 × 8 = 2960 bytes. Este traz 540 − 20 = 520. Total de dados: 2960 + 520 = <b>3480</b>. O pacote original, com o cabeçalho de 20, tinha 3500 bytes."},
 {q:"Um datagrama de 4000 bytes (3980 de dados + 20 de cabeçalho) deve sair por uma interface com MTU de 1500 bytes. Quantos fragmentos serão gerados?", o:["2","3","4","5","Nenhuma das anteriores"], a:1,
  e:"Cada fragmento leva no máximo 1500 − 20 = 1480 bytes de dados (1480 é múltiplo de 8). 3980 = 1480 + 1480 + 1020 → <b>3 fragmentos</b>. É o Exemplo 2 da aula."},
 {q:"No exemplo anterior, qual é o valor do campo Deslocamento do fragmento no terceiro fragmento?", o:["2960","370","185","1020","Nenhuma das anteriores"], a:1,
  e:"Antes do 3º fragmento vieram 2 × 1480 = 2960 bytes. Em unidades de 8: 2960 ÷ 8 = <b>370</b>. Os deslocamentos são 0, 185 e 370."},
 {q:"Um datagrama de 1220 bytes (1200 de dados + 20 de cabeçalho) passa por uma interface com MTU de 500 bytes. Quantos bytes de dados vão no último fragmento?", o:["480","240","220","500","Nenhuma das anteriores"], a:1,
  e:"Máximo por fragmento: 500 − 20 = 480. 1200 = 480 + 480 + <b>240</b>. É o Exemplo 1 da aula: deslocamentos 0, 60 e 120."},
 {q:"Um pacote com cabeçalho de 24 bytes (HLEN = 6) precisa ser fragmentado para uma MTU de 500 bytes. Qual o máximo de bytes de dados em cada fragmento, exceto o último?", o:["476","480","472","500","Nenhuma das anteriores"], a:2, flag:"Detalhe que pega",
  e:"500 − 24 = 476, mas até o penúltimo fragmento os dados precisam ser <b>múltiplo de 8</b> (o deslocamento é contado em blocos de 8). O múltiplo de 8 logo abaixo de 476 é <b>472</b>."},
 {q:"Onde acontece a remontagem de um datagrama IPv4 fragmentado?", o:["Em cada roteador do caminho","No primeiro roteador depois da origem","Somente no host de destino","No roteador com a menor MTU","Nenhuma das anteriores"], a:2,
  e:"No IPv4, a fragmentação pode acontecer na origem ou em qualquer roteador, mas a <b>remontagem só no destino</b>. Os fragmentos podem até seguir caminhos diferentes."},
 {q:"Qual é a representação binária da máscara 255.255.255.224?", o:["11111111.11111111.11111111.11100000","11111111.11111111.11111111.11110000","11111111.11111111.11111111.11000000","11111111.11111111.11111110.00000000","Nenhuma das anteriores"], a:0,
  e:"255 = 11111111. 224 = 128 + 64 + 32 = <b>11100000</b>. Ao todo, 27 bits 1: /27."},
 {q:"A máscara 255.255.248.0 corresponde a qual prefixo?", o:["/19","/20","/21","/22","Nenhuma das anteriores"], a:2,
  e:"248 = 11111000 (5 bits 1). 8 + 8 + 5 = <b>/21</b>."},
 {q:"O bloco 172.16.0.0/16 foi dividido em 8 sub-redes de mesmo tamanho. Qual a nova máscara?", o:["/18","/19","/20","/24","Nenhuma das anteriores"], a:1,
  e:"8 = 2<sup>3</sup> → /16 + 3 = <b>/19</b> (255.255.224.0)."},
 {q:"Nessa divisão (172.16.0.0/16 em 8), qual é o endereço da terceira sub-rede?", o:["172.16.32.0","172.16.64.0","172.16.96.0","172.16.3.0","Nenhuma das anteriores"], a:1,
  e:"/19 → máscara 224 no 3º octeto, bloco de 32: 172.16.0.0, 172.16.32.0, <b>172.16.64.0</b>…"},
 {q:"Uma sub-rede precisa de 25 hosts. Qual a máscara que atende com a máxima economia?", o:["/26","/27","/28","/25","Nenhuma das anteriores"], a:1,
  e:"25 + 2 = 27 endereços → próxima potência de 2 é 32 → <b>/27</b> (30 hosts). A /28 só tem 14 hosts."},
 {q:"Com VLSM, da maior para a menor rede, o bloco 192.168.50.0/24 atende: Vendas 100 hosts, Suporte 50 hosts e Diretoria 20 hosts. Qual a rede/máscara da Diretoria?", o:["192.168.50.192/27","192.168.50.160/27","192.168.50.128/26","192.168.50.192/26","Nenhuma das anteriores"], a:0,
  e:"Vendas: 100 → /25 (192.168.50.0 a .127). Suporte: 50 → /26 (.128 a .191). Diretoria: 20 → /27, começando no .192: <b>192.168.50.192/27</b>."},
 {q:"O endereço 10.0.47.255/20 é um endereço de:", o:["Rede","Host","Broadcast","Nenhuma das anteriores"], a:2,
  e:"/20 → máscara 240 no 3º octeto, bloco de 16: 0–15, 16–31, <b>32–47</b>. 10.0.47.255 é o último endereço de 10.0.32.0/20: <b>broadcast</b>."},
 {q:"Qual a forma mais compactada válida do endereço 2001:0db8:0000:0000:0000:0abc:0000:0001?", o:["2001:db8::abc::1","2001:db8::abc:0:1","2001:db8:0:abc::1","2001:db8:::abc:0:1","Nenhuma das anteriores"], a:1,
  e:"Tira os zeros à esquerda e troca a <b>maior</b> sequência de zeros (três grupos seguidos) por ::, uma vez só: <b>2001:db8::abc:0:1</b>. A a) usa :: duas vezes; a c) poria o abc no lugar errado."},
 {q:"O cabeçalho base do IPv6 tem:", o:["20 bytes fixos","De 20 a 60 bytes","40 bytes fixos","128 bytes fixos","Nenhuma das anteriores"], a:2,
  e:"<b>40 bytes fixos</b>, com 8 campos. O IPv4 é que varia de 20 a 60."},
 {q:"No IPv6, o equivalente ao endereço de loopback 127.0.0.1 do IPv4 é:", o:["::/128","::1/128","FE80::1","FF02::1","Nenhuma das anteriores"], a:1,
  e:"<b>::1</b> = loopback. :: (tudo zero) é o “não especificado”, como o 0.0.0.0; FE80:: é link-local; FF02::1 é o multicast de todos os nós."},
 {q:"Um endereço IPv6 que começa com FE80 é:", o:["Global unicast (público)","Link-local, válido só no enlace","Multicast","Loopback","Nenhuma das anteriores"], a:1,
  e:"FE80::/10 = <b>link-local</b>: configurado automaticamente e não passa de roteador. Global unicast começa com 2 ou 3 (2000::/3); multicast, com FF."},
 {q:"O que um roteador IPv6 faz com um pacote maior que a MTU da interface de saída?", o:["Fragmenta o pacote","Descarta o pacote e envia à origem uma mensagem ICMPv6 Packet Too Big","Envia o pacote pela interface de maior MTU","Reduz o tamanho do cabeçalho base","Nenhuma das anteriores"], a:1,
  e:"No IPv6 o roteador <b>não fragmenta</b>: descarta e avisa a origem com <b>Packet Too Big</b>. Quem fragmenta é a própria origem (descoberta do Path MTU)."},
 {q:"Qual mecanismo de transição transmite pacotes IPv6 dentro de pacotes IPv4, aproveitando a infraestrutura IPv4 que já existe?", o:["Pilha dupla","Tunelamento","Tradução","NAT","Nenhuma das anteriores"], a:1,
  e:"<b>Tunelamento</b> (6to4, ISATAP, Teredo, GRE…): encapsula o IPv6 dentro do IPv4. Pilha dupla = o dispositivo fala os dois; tradução = converte entre um e outro."},
 {q:"Um dispositivo tem endereço IPv4 e IPv6 e fala com cada nó no protocolo que ele entende. Isso é:", o:["Pilha dupla","Tunelamento 6to4","Tradução (SIIT)","Nenhuma das anteriores"], a:0,
  e:"<b>Pilha dupla</b>: os dois protocolos no mesmo dispositivo, com um endereço de cada."},
 {q:"Qual mensagem ICMP o roteador envia à origem quando o TTL de um pacote chega a zero?", o:["Echo Reply","Destination Unreachable","Time Exceeded","Redirect","Nenhuma das anteriores"], a:2,
  e:"<b>Time Exceeded</b> (tipo 11). O pacote é descartado e a origem é avisada. O traceroute usa justamente isso."},
 {q:"O comando ping usa quais mensagens ICMP?", o:["Echo Request e Echo Reply","Time Exceeded","Destination Unreachable","Router Advertisement","Nenhuma das anteriores"], a:0,
  e:"O ping manda <b>Echo Request</b> (tipo 8) e espera o <b>Echo Reply</b> (tipo 0)."},
 {q:"Pela tabela de rotas, para onde o R1 encaminha um pacote com destino 172.16.2.10?", pre:TBL_P2, o:["GigabitEthernet0/0, direto (rede conectada)","Via 10.0.0.2, pela Serial0/0/0","Via 10.0.0.6, pela Serial0/0/1","Pela rota padrão, via 200.5.5.1","Nenhuma das anteriores"], a:1,
  e:"Faixas: 172.16.1.0/24 = 1.0–1.255 (não); 172.16.0.0/22 = 0.0–3.255 (<b>sim</b>); 172.16.4.0/23 = 4.0–5.255 (não). Só a /22 contém: <b>via 10.0.0.2, Serial0/0/0</b>."},
 {q:"E um pacote com destino 172.16.6.1?", pre:TBL_P2, o:["GigabitEthernet0/0, direto (rede conectada)","Via 10.0.0.2, pela Serial0/0/0","Via 10.0.0.6, pela Serial0/0/1","Pela rota padrão, via 200.5.5.1","Nenhuma das anteriores"], a:3,
  e:"A /23 vai só até 172.16.5.255 e a /22 até 172.16.3.255. Nenhuma rota contém 172.16.6.1 → <b>rota padrão</b> (S* via 200.5.5.1). Sem a rota padrão, o pacote seria descartado e a origem receberia um ICMP Destination Unreachable."},
 {q:"E um pacote com destino 172.16.1.77?", pre:TBL_P2, o:["GigabitEthernet0/0, direto (rede conectada)","Via 10.0.0.2, pela Serial0/0/0","Via 10.0.0.6, pela Serial0/0/1","Pela rota padrão, via 200.5.5.1","Nenhuma das anteriores"], a:0,
  e:"Duas rotas contêm: 172.16.0.0/22 e 172.16.1.0/24. Ganha a de <b>maior prefixo</b>, a /24: rede conectada, sai pela <b>GigabitEthernet0/0</b> direto para o host."},
 {q:"O IDS (Intrusion Detection System) bloqueia ativamente os ataques que detecta.", o:VF, a:1,
  e:"O IDS <b>detecta, registra e relata</b>, mas não impede. Quem bloqueia é o <b>IPS</b>."},
 {q:"Um ataque que intercepta e altera o valor de uma transação durante o trânsito quebra o pilar da integridade.", o:VF, a:0,
  e:"Integridade = o dado chega sem alteração. Alterou em trânsito → quebrou a integridade."},
 {q:"O worm precisa que o usuário execute um arquivo para se propagar.", o:VF, a:1,
  e:"Quem depende da execução pelo usuário é o <b>vírus</b>. O worm se replica <b>sozinho</b>, explorando vulnerabilidades da rede."},
 {q:"As ameaças internas têm potencial de causar mais dano que as externas, porque o usuário interno já tem acesso e conhece a rede.", o:VF, a:0,

 {q:"A criptografia dos dados impede que:", o:["Os dados sejam interceptados","Uma pessoa não autorizada leia o conteúdo, mesmo que intercepte","O computador seja infectado por vírus","A rede sofra ataques DDoS","Nenhuma das anteriores"], a:1,

 {q:"(Aberta) O que faz o protocolo ICMP? Cite exemplos de mensagens.", o:OPEN_O, a:0, e:OPEN_E,
  open:`<p>O <b>ICMP</b> (Internet Control Message Protocol, RFC 792) é um protocolo da <b>camada de rede</b>, que trabalha junto com o IP. Serve para enviar <b>mensagens de erro e de controle</b> sobre a entrega dos pacotes: avisa a origem quando algo deu errado no caminho e permite testar a rede. As mensagens vão <b>encapsuladas em pacotes IP</b>.</p>
  <p>Exemplos: <b>Echo Request / Echo Reply</b> (usadas pelo ping); <b>Destination Unreachable</b> (rede, host, protocolo ou porta inalcançável); <b>Time Exceeded</b> (TTL chegou a zero, usado pelo traceroute).</p>`},
 {q:"(Aberta) O que faz o comando ping e como ele funciona?", o:OPEN_O, a:0, e:OPEN_E,
  open:`<p>O <b>ping</b> testa a <b>conectividade</b> entre dois dispositivos na rede. Ele envia mensagens <b>ICMP Echo Request</b> ao destino; se o destino estiver alcançável, responde com <b>ICMP Echo Reply</b>.</p>
  <p>Com as respostas, o ping mostra se há comunicação, o <b>tempo de ida e volta</b> (RTT, em ms), o TTL recebido e a <b>perda de pacotes</b>. Se não houver resposta, ou se vier um Destination Unreachable, há problema no caminho (rota faltando, host desligado, firewall bloqueando ICMP).</p>`},
]};

const SUMMARY2 = [
 {id:"sub", t:"Sub-redes (máscara fixa)", b:`
  <p>Dividir um bloco em N sub-redes iguais: <b>empresta bits do host</b>, a partir do mais significativo. Com n bits emprestados, 2<sup>n</sup> sub-redes.</p>
  <ol class="steps"><li>Menor n com 2<sup>n</sup> ≥ N. Nova máscara = prefixo + n.</li>
  <li>Bits de host que sobram = 32 − novo prefixo → 2<sup>h</sup> endereços, 2<sup>h</sup> − 2 hosts.</li>
  <li>No octeto onde a máscara “quebra”: bloco = 256 − valor da máscara. As redes andam de bloco em bloco.</li>
  <li>Broadcast de cada uma = próxima rede − 1.</li></ol>
  <p>Exemplo (aula): 172.16.0.0/16 em 4 → /18 (255.255.192.0), bloco de 64 no 3º octeto: 172.16.0.0, .64.0, .128.0, .192.0.</p>

  <p>Máscaras de tamanhos diferentes no mesmo bloco, cada uma do tamanho da necessidade. Economiza endereços.</p>
  <ol class="steps"><li>Ordene as redes da <b>maior para a menor</b>.</li>
  <li>Para cada uma: menor potência de 2 ≥ hosts + 2. Enlace ponto a ponto = /30.</li>
  <li>Aloque em sequência: cada rede começa no endereço seguinte ao broadcast da anterior.</li></ol>

  <p>Se o pacote é maior que a <b>MTU</b> da interface de saída, ele é fragmentado (na origem ou em qualquer roteador). A <b>remontagem é só no destino</b>. A fragmentação é sobre os <b>dados</b>; cada fragmento ganha um cabeçalho.</p>

const PV2_TREINO = {id:"pv2-treino", t:"Treino de contas", layer:"Contas da PV2", kind:"train2"};
const T2M = [["frag","Fragmentação"],["div","Divisão de rede"],["vlsm","VLSM"],["bin","Binário"],["v6","IPv6"]];
const t2ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const t2pick = a => a[Math.floor(Math.random()*a.length)];
const t2ip = x => numIp(x).join(".");
const t2mask = p => t2ip(2**32 - 2**(32-p));
const t2shuf = a => { const b = a.slice(); for (let i = b.length-1; i > 0; i--) { const j = t2ri(0,i); [b[i],b[j]] = [b[j],b[i]]; } return b; };
const T2CHK = {
  num: (v,a) => { const d = String(v || "").replace(/\D/g, ""); return d !== "" && d === String(a); },
  ip:  (v,a) => normIp(v) === a,
  pfx: (v,a) => { const s = String(v || "").trim(), m = s.match(/^\/?\s*(\d{1,2})$/); return m ? +m[1] === a : normIp(s) === t2mask(a); },
  bin: (v,a) => String(v || "").replace(/[\s.]/g, "") === a,
  txt: (v,a) => String(v || "").trim().toLowerCase() === String(a).toLowerCase(),
};
function t2base(p){
  const f = t2pick([10,172,192,200]);
  const o = f === 10 ? [10, t2ri(0,255), t2ri(0,255), t2ri(0,255)] : f === 172 ? [172, t2ri(16,31), t2ri(0,255), t2ri(0,255)]
          : f === 192 ? [192, 168, t2ri(0,255), t2ri(0,255)] : [200, t2ri(1,250), t2ri(0,255), t2ri(0,255)];
  const v = ipNum(o), s = 2**(32-p);
  return v - v % s;
}
// IPv6: forma completa e a forma mais compactada (zeros à esquerda fora; a maior sequência de zeros vira ::)
const v6full = g => g.map(x => x.toString(16).padStart(4,"0")).join(":");
function v6comp(g){
  let bs = -1, bl = 0;
  for (let i = 0; i < 8; ) { if (g[i] === 0) { let j = i; while (j < 8 && g[j] === 0) j++; if (j-i > bl) { bs = i; bl = j-i; } i = j; } else i++; }
  const h = g.map(x => x.toString(16));
  if (bl < 2) return h.join(":");
  return h.slice(0,bs).join(":") + "::" + h.slice(bs+bl).join(":");
}
function v6gen(){
  const r = () => t2pick([t2ri(1,0xf), t2ri(0x10,0xff), t2ri(0x100,0xfff), t2ri(0x1000,0xffff)]);
  if (Math.random() < .25) return [0xfe80,0,0,0,r(),r(),r(),r()];
  const L = t2ri(2,4), s = t2pick([1,2,3,8-L].filter(x => x >= 1 && x + L <= 8)), g = [];
  for (let i = 0; i < 8; i++) g.push(i >= s && i < s+L ? 0 : r());
  g[0] = t2pick([0x2001,0x2001,0x2804,0x2800]);
  // às vezes um zero solto, longe da sequência principal (não empata com ela)

  items.forEach(({i}, n) => h += cardHTML(T, i, n));

}

function cardHTML(T, i, n = 0, src = ""){
  const Q = T.qs[i], k = T.id+"-"+i, chosen = S.ans[k], s = status(T,i), rev = revealed(T,i) && chosen !== undefined;
  const locked = studyMode() ? chosen !== undefined : !!S.checked[T.id];
  const cls = rev ? s : (chosen !== undefined ? "pending" : "");
  const pv = T.group === "pv2" ? "PV2" : "PV1", open = Q.open != null, shown = open && !!S.shown[k];
  const tags = (src ? `<span class="src">${src}</span>` : "") + (Q.tag ? `<span class="hot${Q.tag==="parecida" ? " alt" : ""}">${Q.tag==="igual" ? "Caiu igual na "+pv : "Caiu parecida na "+pv}</span>` : "")
             + (open ? `<span class="src">Aberta</span>` : "") + (Q.flag ? `<span class="flag">${Q.flag}</span>` : "");
  let h = `<article class="q ${cls} ${locked ? "locked" : ""}" id="q-${k}" data-s="${s}" style="--i:${Math.min(n,12)}">
    <div class="q-top"><span class="num">${String(i+1).padStart(2,"0")}</span><div>
    <p class="stem">${esc(Q.q)}</p><div class="tags">${tags}</div>${Q.note ? `<p class="qnote">${Q.note}</p>` : ""}</div></div>
    ${Q.fig ? `<figure class="fig">${Q.fig}</figure>` : ""}
    ${Q.code ? `<pre class="table">${esc(TABLES[Q.code])}</pre>` : ""}
    ${Q.pre ? `<pre class="table">${esc(Q.pre)}</pre>` : ""}`;
  if (open) {
    h += `<div class="openq"><textarea class="open-in" data-ot="${k}" rows="4" placeholder="Escreva sua resposta aqui (fica salva só neste navegador)…" aria-label="Sua resposta">${esc(S.txt[k] || "")}</textarea>
      ${shown ? `<div class="model"><strong>Gabarito</strong>${Q.open}</div><p class="self">Compare e marque:</p>` : `<button class="btn ghost" type="button" data-show="${k}">Ver gabarito e corrigir</button>`}</div>`;
    if (!shown) return h + `</article>`;
  }
  h += `<div class="opts" role="radiogroup" aria-label="Alternativas da questão ${i+1}">`;
  Q.o.forEach((o,j) => {
    let c = "opt", ic = "";
    if (chosen === j) c += " sel";
    if (rev && j === Q.a) { c += " right"; ic = ICO_OK; }
    else if (rev && chosen === j) { c += " wrong"; ic = ICO_BAD; }
    h += `<label class="${c}"><input type="radio" name="r${k}" id="r${k}-${j}" value="${j}" ${chosen===j ? "checked" : ""} ${locked ? "disabled" : ""} data-k="${k}" data-i="${i}">
      <span class="dot">${ic}</span><span class="l">${L[j]}</span><span>${esc(o)}</span></label>`;
  });
  h += `</div>`;
  if (rev) h += `<div class="fb"><strong class="${s==="ok" ? "v-ok" : "v-bad"}">${s==="ok" ? "Correto." : "Resposta: "+L[Q.a]+") "+esc(Q.o[Q.a])}</strong> ${Q.e}</div>`;
  return h + `</article>`;
}

/* ---------- treino de contas ---------- */
const PFX = [8,12,16,16,18,19,20,20,21,22,22,23,24,24,25,26,26,27,27,28,29,30];
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
function newTQ(){ let o1; do { o1 = rnd(1,223); } while (o1 === 127); return {ip:[o1,rnd(0,255),rnd(0,255),rnd(0,255)], p:PFX[rnd(0,PFX.length-1)], vals:{}, res:null}; }
const ipNum = ip => ((ip[0]*256 + ip[1])*256 + ip[2])*256 + ip[3];
const numIp = x => [Math.floor(x/16777216)%256, Math.floor(x/65536)%256, Math.floor(x/256)%256, x%256];
const bin8 = n => n.toString(2).padStart(8,"0");
function calc(ip, p){
  const size = 2**(32-p), v = ipNum(ip), net = v - v%size, bc = net + size - 1, maskO = numIp(2**32 - size);
  return {v, netN:net, bcN:bc, maskO, mask:maskO.join("."), net:numIp(net).join("."), bc:numIp(bc).join("."),
          first:numIp(net+1).join("."), last:numIp(bc-1).join("."), total:size, hosts:Math.max(0,size-2)};
}
function steps(ip, p){
  const r = calc(ip,p), k = Math.floor(p/8), rem = p%8, hb = 32-p, O = ["1º","2º","3º","4º"];
  const s = [`<li><b>Máscara.</b> /${p} = ${p} bits 1 seguidos de ${hb} bits 0: <code>${r.maskO.map(bin8).join(".")}</code> → <b>${r.mask}</b>.</li>`];
  if (rem === 0) {
    s.push(`<li><b>Rede e broadcast.</b> /${p} fecha certinho em ${k} octeto${k>1 ? "s" : ""}: ${k===1 ? "o primeiro fica igual" : `os ${k} primeiros ficam iguais`}, e os outros viram 0 na rede e 255 no broadcast → rede <b>${r.net}</b>, broadcast <b>${r.bc}</b>.</li>`);
  } else {
    const mo = r.maskO[k], blk = 256-mo, v = ip[k], lo = v - v%blk, hi = lo + blk - 1;
    const seq = [lo-blk, lo, lo+blk].filter(x => x >= 0 && x < 256);
    s.push(`<li><b>Octeto que “quebra”:</b> o ${O[k]}, onde a máscara vale ${mo} (<code>${bin8(mo)}</code>). Bloco = 256 − ${mo} = <b>${blk}</b>.</li>`);
    s.push(`<li><b>Rede.</b> No ${O[k]} octeto, os blocos andam de ${blk} em ${blk} (${seq[0]===0 ? "" : "…, "}${seq.join(", ")}, …). O ${v} cai no bloco <b>${lo}–${hi}</b>. A rede começa no ${lo}${k<3 ? ", e os octetos seguintes viram 0" : ""} → <b>${r.net}</b>.</li>`);
    s.push(`<li><b>Broadcast.</b> É o fim do bloco: ${hi}${k<3 ? ", e os octetos seguintes viram 255" : ""} → <b>${r.bc}</b>.</li>`);
  }
  s.push(`<li><b>Endereços e hosts.</b> ${hb} bits de host → 2<sup>${hb}</sup> = <b>${fmtInt(r.total)}</b> endereços no total. Tirando rede e broadcast, sobram <b>${fmtInt(r.hosts)}</b> hosts utilizáveis (de ${r.first} a ${r.last}).</li>`);
  return s.join("");
}
const TF = [["mask","Máscara"],["net","Endereço de rede"],["bc","Broadcast"],["total","Endereços no total"],["hosts","Hosts utilizáveis"]];
function trainHTML(){
  if (!S.tq) { S.tq = newTQ(); save(); }
  return `<div class="sec-head"><div><h2>Treino de contas</h2><p>Como a primeira página da PV1 · uma conta nova a cada clique</p></div></div>
  <div data-anim>
    <div class="card" style="--i:0" id="tcard">${tqHTML()}</div>
    <div class="card" style="--i:1"><h3>Resolver qualquer endereço</h3>
      <p class="sub">Digite um IP com prefixo (10.0.40.200/16) ou com máscara (10.0.40.200 255.255.0.0) para ver a resolução passo a passo. Serve para conferir as contas da lista.</p>
      <input class="calc-in" id="calc" placeholder="ex.: 172.31.10.10/20" autocomplete="off" spellcheck="false" value="${esc(S.calc || "")}">
      <div id="calc-out"></div></div>
  </div>`;
}
function tqHTML(){
  const q = S.tq, r = calc(q.ip, q.p), res = q.res;
  const ans = {mask:r.mask, net:r.net, bc:r.bc, total:fmtInt(r.total), hosts:fmtInt(r.hosts)};
  const nOk = res ? Object.values(res).filter(Boolean).length : 0;
  return `<h3>Dado o endereço abaixo, responda:</h3><p class="tq"><code>${q.ip.join(".")} /${q.p}</code></p>
  <div class="fields">${TF.map(([k,l]) => `<label class="field${res ? (res[k] ? " ok" : " bad") : ""}">${l}
    <input data-tf="${k}" value="${esc(q.vals?.[k] || "")}" autocomplete="off" spellcheck="false" ${k==="total"||k==="hosts" ? 'inputmode="numeric"' : 'inputmode="decimal"'} ${res ? "readonly" : ""}>
    <span class="ans">${res ? (res[k] ? "✓ certo" : "✗ " + ans[k]) : ""}</span></label>`).join("")}</div>
  <div class="acts-row">${res
    ? `<button class="btn" type="button" id="t-new">Nova conta →</button><span class="verdict ${nOk===5 ? "ok" : "bad"}">${nOk===5 ? "Tudo certo!" : `${nOk} de 5 certos`}</span>`
    : `<button class="btn" type="button" id="t-check">Conferir</button><button class="btn ghost" type="button" id="t-skip">Pular</button>`}</div>
  ${res ? `<ol class="steps">${steps(q.ip, q.p)}</ol>` : ""}`;
}
function normIp(s){
  const p = String(s || "").trim().split(/[.\s,]+/).filter(Boolean);
  if (p.length !== 4 || p.some(x => !/^\d{1,3}$/.test(x))) return null;
  return p.map(Number).join(".");
}
function checkTQ(){
  const q = S.tq, r = calc(q.ip, q.p), v = {};
  document.querySelectorAll("[data-tf]").forEach(inp => v[inp.dataset.tf] = inp.value);
  const num = s => String(s || "").replace(/\D/g, "");
  const pm = String(v.mask || "").trim().match(/^\/\s*(\d{1,2})$/);
  q.vals = v;
  q.res = { mask: normIp(v.mask) === r.mask || (pm && +pm[1] === q.p), net: normIp(v.net) === r.net, bc: normIp(v.bc) === r.bc,
            total: num(v.total) === String(r.total), hosts: num(v.hosts) === String(r.hosts) };
  S.train.n++; if (Object.values(q.res).every(Boolean)) S.train.ok++;
  save(); paintTQ(true); renderTabs(); renderStat();
  NET.burst(Object.values(q.res).every(Boolean) ? "ok" : "bad", $("#tcard"));
}
function paintTQ(fresh){
  const c = $("#tcard"); c.innerHTML = tqHTML();
  c.classList.remove("fresh"); if (fresh) { void c.offsetWidth; c.classList.add("fresh"); }
}
function calcRender(){
  const el = $("#calc-out"); if (!el) return;
  const s = (S.calc || "").trim(); if (!s) { el.innerHTML = ""; return; }
  const err = t => el.innerHTML = `<p class="calc-err">${t}</p>`;
  const m = s.match(/^(\d{1,3}(?:\.\d{1,3}){3})\s*(?:\/\s*(\d{1,2})|\s+(\d{1,3}(?:\.\d{1,3}){3}))$/);
  if (!m) return err("Formato: 192.168.1.10/24 ou 192.168.1.10 255.255.255.0");
  const ip = m[1].split(".").map(Number);
  if (ip.some(x => x > 255)) return err("Cada octeto vai de 0 a 255.");
  let p;
  if (m[2] != null) p = +m[2];
  else {
    const mk = m[3].split(".").map(Number), bits = mk.map(x => x > 255 ? "x" : bin8(x)).join("");
    if (!/^1*0*$/.test(bits)) return err("Essa máscara não é válida: os bits 1 precisam vir todos juntos, à esquerda.");
    p = bits.indexOf("0"); if (p < 0) p = 32;
  }
  if (p < 1 || p > 32) return err("O prefixo vai de /1 a /32.");
  const r = calc(ip, p);
  if (p > 30) return el.innerHTML = `<dl class="res"><dt>Máscara</dt><dd>${r.mask} (/${p})</dd><dt>Endereços</dt><dd>${r.total}</dd></dl>
    <p class="calc-err">/${p} é caso especial (${p===31 ? "enlace ponto a ponto com 2 endereços, sem rede nem broadcast" : "um único host"}); a regra do −2 não vale aqui.</p>`;
  const kind = r.v === r.netN ? "o endereço de rede" : r.v === r.bcN ? "o endereço de broadcast" : "um endereço de host";
  el.innerHTML = `<dl class="res"><dt>Máscara</dt><dd>${r.mask} (/${p})</dd><dt>Rede</dt><dd>${r.net}</dd><dt>Broadcast</dt><dd>${r.bc}</dd>
    <dt>Hosts</dt><dd>${r.first} a ${r.last}</dd><dt>Endereços</dt><dd>${fmtInt(r.total)} no total · ${fmtInt(r.hosts)} hosts</dd><dt>${m[1]} é</dt><dd>${kind}</dd></dl>
    <details class="how"><summary>Ver o passo a passo</summary><ol class="steps">${steps(ip, p)}</ol></details>`;
}

/* ---------- eventos ---------- */
document.addEventListener("change", e => {
  const t = e.target; if (t.dataset && t.dataset.k) answer(t.dataset.k, +t.dataset.i, +t.value);
  else if (t.dataset && t.dataset.rt) rtAnswer(t.dataset.rt);
  else if (t.dataset && t.dataset.rsg) { document.querySelectorAll(`[data-rs][data-rgi="${t.dataset.rsg}"]:not(:disabled)`).forEach(x => x.checked = t.checked); rsSync(); }
  else if (t.dataset && t.dataset.rs) rsSync();
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "calc") { S.calc = t.value; save(); calcRender(); }
  else if (t.id === "rt-free") { S.rtFree = t.value; save(); rtFreeRender(); }
  else if (t.dataset && t.dataset.tf && S.tq) { (S.tq.vals ||= {})[t.dataset.tf] = t.value; save(); }
  else if (t.dataset && t.dataset.t2f && S.t2) { (S.t2.vals ||= {})[t.dataset.t2f] = t.value; save(); }
  else if (t.dataset && t.dataset.ot) { S.txt[t.dataset.ot] = t.value; save(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#reset-modal").hidden) { closeReset(); return; }
  if (e.key === "Escape" && confirming) { confirming = null; const c = $("#confirm-part"); if (c) c.hidden = true; }
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.tf && S.tq && !S.tq.res) { e.preventDefault(); checkTQ(); }
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.t2f && S.t2 && !S.t2.res) { e.preventDefault(); t2Check(); }
});
document.addEventListener("click", e => {
  const g = e.target.closest("[data-g]");
  if (g) { S.group = g.dataset.g; S.filter = "todas"; confirming = null; save(); render(); window.scrollTo(0,0); return; }
  const tb = e.target.closest(".tab"); if (tb) { go(tb.dataset.t); return; }
  const gt = e.target.closest("[data-go]"); if (gt) { go(gt.dataset.go); return; }
  const jp = e.target.closest("[data-jump]");
  if (jp) {
    const [t, n] = jp.dataset.jump.split(":"); go(t, false);
    const el = document.getElementById(`q-${t}-${n-1}`);
    if (el) { el.scrollIntoView({block:"center", behavior: reduced() ? "auto" : "smooth"}); flash(el); }
    return;
  }
  const f = e.target.closest("[data-f]"); if (f) { S.filter = f.dataset.f; save(); renderMain(); return; }
  const sc = e.target.closest("[data-sec]");
  if (sc) { const el = document.getElementById("tp-"+sc.dataset.sec); if (el) { window.scrollTo({top: el.getBoundingClientRect().top + scrollY - headerH() - 14, behavior: reduced() ? "auto" : "smooth"}); flash(el); } return; }
  const st = e.target.closest("[data-study]"); if (st) { toggleStudy(st.dataset.study); return; }
  const sh = e.target.closest("[data-show]"); if (sh) { showModel(sh.dataset.show); return; }
  const tm = e.target.closest("[data-t2m]");
  if (tm) { S.t2m = tm.dataset.t2m; if (S.t2?.mode !== S.t2m) S.t2 = t2New(S.t2m); save(); const y = scrollY; renderMain(false); window.scrollTo(0,y); return; }
  if (e.target.closest("[data-cancel]")) { confirming = null; const c = $("#confirm-part"); if (c) c.hidden = true; return; }
  const id = e.target.closest("button")?.id;
  if (id === "m-estudo" || id === "m-prova") { S.mode = id.slice(2); save(); const y = scrollY; render(false); window.scrollTo(0,y); return; }
  if (id === "corrigir") {
    const T = cur(), y = scrollY; S.checked[T.id] = true; save();
    renderMain(false); $(".list")?.classList.add("reveal"); renderTabs(); renderStat(); window.scrollTo(0,y);
    const st = stats(T); NET.burst(st.ok >= st.bad ? "ok" : "bad"); return;
  }
  if (id === "reset-all") { openReset(); return; }
  if (e.target.id === "reset-modal" || e.target.closest("[data-rs-close]")) { closeReset(); return; }
  if (id === "rs-all") { const on = $("#rs-all").textContent.startsWith("Selecionar"); document.querySelectorAll("[data-rs]:not(:disabled)").forEach(x => x.checked = on); rsSync(); return; }
  if (id === "rs-apply") { applyReset(); return; }
  if (id === "undo") { undoReset(); return; }
  if (id === "reset") {
    confirming = confirming === "part" ? null : "part"; const c = $("#confirm-part"); c.hidden = confirming !== "part";
    if (confirming) { c.scrollIntoView({block:"nearest"}); $("#do-reset").focus(); } return;
  }
  if (id === "do-reset") {
    const T = cur(); confirming = null; T.qs.forEach((_,i) => { const k = T.id+"-"+i; delete S.ans[k]; delete S.shown[k]; delete S.txt[k]; }); delete S.checked[T.id]; S.filter = "todas";
    save(); render(); window.scrollTo(0,0); return;
  }
  if (id === "t-check") { checkTQ(); return; }
  if (id === "t2-check") { t2Check(); return; }
  if (id === "t2-new" || id === "t2-skip") { S.t2 = t2New(S.t2.mode); save(); t2Paint(false); $("#t2card input")?.focus(); return; }
  if (id === "rt-new" || id === "rt-again") {
    if (id === "rt-new") S.rq = genRT(); else { let d; do { d = genDest(S.rq); } while (d === S.rq.dest); S.rq.dest = d; S.rq.ans = null; }
    save(); const c = $("#rtcard"); c.innerHTML = rtCardHTML(); c.classList.remove("just-ok","just-bad");
    c.scrollIntoView({block:"nearest", behavior: reduced() ? "auto" : "smooth"});
    const f = $("#rt-free"); if (f) f.placeholder = `ex.: 10.${S.rq.k}.2.10`; rtFreeRender(); return;
  }
  if (id === "t-new" || id === "t-skip") { S.tq = newTQ(); save(); paintTQ(false); $("#tcard input")?.focus(); return; }
  if (id === "fab") { nextUnanswered(); return; }
});
render();
</script>
</body>
</html>
