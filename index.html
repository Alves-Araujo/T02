<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulado de Redes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,600;112,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface-2:#F6F8F8; --ink:#14201E; --muted:#5A6A67; --line:#D5DEDC;
  --accent:#0B6E62; --accent-soft:#DDEFEB; --ok:#16794A; --ok-soft:#E1F3E8; --bad:#B8361F; --bad-soft:#FBE7E2;
  --warn:#8A5A00; --warn-soft:#FBF0D6; --hot:#A3195B; --hot-soft:#FBE4EE; --code-bg:#0F1A18; --code-ink:#CFE7E1;
  --on-accent:#fff; --shadow:0 1px 2px rgba(20,32,30,.05),0 6px 18px -8px rgba(20,32,30,.12);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --display:"Archivo","IBM Plex Sans",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1513; --surface:#16201E; --surface-2:#1B2725; --ink:#E4ECEA; --muted:#93A5A1; --line:#2A3A37;
  --accent:#4FC2AF; --accent-soft:#16332E; --ok:#5BD08F; --ok-soft:#133022; --bad:#F08A73; --bad-soft:#3A1C16;
  --warn:#E8B85A; --warn-soft:#33280F; --hot:#FF8CC2; --hot-soft:#3A1527; --code-bg:#08100E; --code-ink:#BFE0D8;
  --on-accent:#06201C; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1513; --surface:#16201E; --surface-2:#1B2725; --ink:#E4ECEA; --muted:#93A5A1; --line:#2A3A37;
  --accent:#4FC2AF; --accent-soft:#16332E; --ok:#5BD08F; --ok-soft:#133022; --bad:#F08A73; --bad-soft:#3A1C16;
  --warn:#E8B85A; --warn-soft:#33280F; --hot:#FF8CC2; --hot-soft:#3A1527; --code-bg:#08100E; --code-ink:#BFE0D8;
  --on-accent:#06201C; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);padding-inline:16px;padding-block:0 96px;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
code{font:500 .92em var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.wrap{max-width:780px;margin:0 auto;position:relative;z-index:1}
#net{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* ---------- cabeçalho ---------- */
header.top{isolation:isolate;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding-block:12px 10px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;pointer-events:none;
  background:linear-gradient(90deg,transparent 0,transparent 40%,var(--accent) 48%,var(--hot) 52%,transparent 60%,transparent 100%) no-repeat;
  background-size:60% 100%;background-position:-120% 0;animation:sweep 7s cubic-bezier(.45,0,.25,1) infinite;opacity:.85}
@keyframes sweep{0%{background-position:-120% 0}55%,100%{background-position:240% 0}}
.brand-w{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;flex:0 0 auto;overflow:visible}
.logo .lk{stroke:var(--line);stroke-width:1.6;fill:none}
.logo .nd{fill:var(--surface);stroke:var(--accent);stroke-width:1.8}
.logo .pk{fill:var(--accent)} .logo .pk2{fill:var(--hot)}
.logo .rp{fill:none;stroke:var(--accent);stroke-width:1.2}
.top-inner{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.hrow{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.hrow .groups{margin-right:auto;max-width:100%;overflow-x:auto;scrollbar-width:none}
.hrow .groups::-webkit-scrollbar{display:none}
.grp{white-space:nowrap}
.grp .gs{display:none}
.sec-ctl{display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.row1{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;flex-wrap:wrap}
.row-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:20px;white-space:nowrap;letter-spacing:-.01em;margin:0;line-height:1.1}
.brand small{display:block;font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:3px;white-space:nowrap}

.stat{display:flex;align-items:center;gap:9px;text-align:right}
.ring-w{position:relative;width:40px;height:40px;flex:0 0 auto}
.ring{width:40px;height:40px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;transition:stroke-dasharray .7s var(--ease),stroke-dashoffset .7s var(--ease)}
.rg-track{stroke:var(--line)} .rg-ok{stroke:var(--ok)} .rg-bad{stroke:var(--bad)} .rg-warn{stroke:var(--warn)} .rg-acc{stroke:var(--accent)}
.ring-w span{position:absolute;inset:0;display:grid;place-items:center;font:600 10px var(--mono);font-variant-numeric:tabular-nums}
.stat-t{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--muted);line-height:1.3;white-space:nowrap}
.stat-t b{font-size:16px;color:var(--ink);font-weight:600}

.groups{display:inline-flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:11px;background:var(--surface)}
.grp{display:inline-flex;align-items:center;gap:7px;font:600 13.5px var(--sans);border:0;background:transparent;color:var(--muted);padding:7px 13px;border-radius:8px;cursor:pointer;transition:background .2s,color .2s}
.grp:hover{color:var(--ink)}
.grp[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.grp .gn{font:500 11px var(--mono);opacity:.75}
.new{font:600 10px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--hot);background:var(--hot-soft);border-radius:999px;padding:1px 7px}
.grp[aria-pressed="true"] .new{background:var(--hot);color:var(--surface)}

.mode{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.mode button{font:500 13px var(--sans);border:0;background:transparent;color:var(--muted);padding:6px 12px;cursor:pointer;transition:background .2s,color .2s}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;margin:-2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:0;min-width:132px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:5px 11px 6px;cursor:pointer;font:500 13px var(--sans);text-align:left;transition:border-color .2s,background .2s,transform .2s var(--ease)}
.tab:hover{transform:translateY(-1px);border-color:var(--muted)}
.tab .meta{font:500 10.5px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tab .layer{letter-spacing:.05em;text-transform:uppercase}
.tab .prog{font:500 11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.tab .bar{display:flex;width:100%;height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:5px}
.tab .bar i{display:block;height:100%;transition:width .5s var(--ease)}
.bar .b-ok{background:var(--ok)} .bar .b-bad{background:var(--bad)} .bar .b-warn{background:var(--warn)} .bar .b-acc{background:var(--accent)}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.tab[aria-selected="true"] .layer{color:var(--accent)}
button:focus-visible,.opt:focus-within,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- seção ---------- */
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:22px 0 12px}
.sec-head h2{font-family:var(--display);font-stretch:112%;font-weight:600;font-size:19px;margin:0;text-wrap:balance}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.intro{margin:-4px 0 14px;font-size:14px;color:var(--muted);max-width:68ch}
.intro b{color:var(--ink);font-weight:600}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 12.5px var(--sans);border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 11px;cursor:pointer;transition:color .15s,border-color .15s}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}

/* ---------- questões ---------- */
.list{display:flex;flex-direction:column;gap:12px}
.q{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);transition:border-color .3s}
.q.ok{border-left-color:var(--ok)} .q.bad{border-left-color:var(--bad)} .q.pending{border-left-color:var(--warn)}
.q-top{display:flex;gap:12px;align-items:flex-start}
.num{font:600 12px var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:3px 7px;flex:0 0 auto;font-variant-numeric:tabular-nums;margin-top:1px}
.stem{margin:0;font-weight:500;max-width:68ch;white-space:pre-line}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tags:empty{display:none}
.flag{display:inline-block;font:500 11.5px var(--mono);color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:2px 7px;letter-spacing:.02em}
.hot{display:inline-flex;align-items:center;gap:5px;font:600 11.5px var(--mono);color:var(--hot);background:var(--hot-soft);border-radius:4px;padding:2px 7px}
.hot.alt{background:transparent;box-shadow:inset 0 0 0 1px var(--hot)}
.qnote{margin:6px 0 0;font-size:12.5px;color:var(--muted);font-style:italic}
pre.table{margin:0;background:var(--code-bg);color:var(--code-ink);font:12.5px/1.55 var(--mono);padding:12px 14px;border-radius:8px;overflow-x:auto}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{position:relative;display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;background:var(--surface-2);transition:border-color .15s,background .2s,transform .15s var(--ease)}
.opt:hover{border-color:var(--muted);transform:translateX(2px)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.dot{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--muted);flex:0 0 auto;margin-top:2px;display:grid;place-items:center;transition:border-color .15s,background .2s}
.dot svg{width:10px;height:10px;fill:none;stroke:var(--surface);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.opt.sel .dot{border-color:var(--accent)} .opt.sel:not(.right):not(.wrong) .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.opt.sel{border-color:var(--accent)}
.opt .l{font:500 12px var(--mono);color:var(--muted);margin-top:2px;width:1.1em;flex:0 0 auto}
.opt.right{background:var(--ok-soft);border-color:var(--ok)} .opt.right .dot{border-color:var(--ok);background:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)} .opt.wrong .dot{border-color:var(--bad);background:var(--bad)}
.locked .opt{cursor:default} .locked .opt:hover{border-color:var(--line);transform:none} .locked .opt.right:hover{border-color:var(--ok)} .locked .opt.wrong:hover{border-color:var(--bad)}
.fb{border-top:1px dashed var(--line);padding-top:10px;font-size:14px;max-width:70ch}
.fb strong{font-weight:600}
.fb .v-ok{color:var(--ok)} .fb .v-bad{color:var(--bad)}

/* figuras */
.fig{margin:0;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto}
.fig svg{display:block;width:100%;height:auto;margin:0 auto}
.dg-l{stroke:var(--muted);stroke-width:1.6;fill:none;stroke-linejoin:round}
.dg-n{fill:var(--surface);stroke:var(--accent);stroke-width:1.6}
.dg-i{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dg-t{fill:var(--ink);font:600 11.5px var(--mono)}
.dg-s{fill:var(--muted);font:500 10.5px var(--mono)}
.dg-t,.dg-s{paint-order:stroke;stroke:var(--surface-2);stroke-width:4px;stroke-linejoin:round}
.dg-v20 .dg-n,.dg-v20 .dg-i{stroke:var(--hot)}
.dg-hl .dg-n{fill:var(--accent-soft)}
.hdr{min-width:320px;font-size:12px}
.hdr.wide{min-width:560px}
.hdr-row{display:grid;grid-template-columns:repeat(32,1fr)}
.hdr-ruler{display:grid;grid-template-columns:repeat(32,1fr);font:500 10px var(--mono);color:var(--muted);margin-bottom:3px}
.hdr-ruler span:nth-child(2n){text-align:right}
.hdr-ruler span:nth-child(2){padding-right:6px} .hdr-ruler span:nth-child(3){padding-left:6px;border-left:1px dashed var(--line)}
.hdr-cell{border:1px solid var(--accent);margin:0 -1px -1px 0;background:var(--surface);padding:6px 4px;text-align:center;line-height:1.3;min-width:0}
.hdr-cell small{display:block;font:500 10px var(--mono);color:var(--muted)}
.hdr-cell b{display:block;font:600 13px var(--mono);color:var(--accent);overflow-wrap:anywhere}
.hdr-cap{margin-top:8px;font:500 11px var(--mono);color:var(--muted)}

/* rodapé da aba */
.foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:18px}
.foot .score{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.foot .score b{font-size:20px;color:var(--ink);font-weight:600}
.btn{font:600 14px var(--sans);border-radius:8px;padding:10px 16px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);transition:transform .15s var(--ease),background .15s,color .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.ghost{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.btn.ghost:hover{background:var(--accent);color:var(--on-accent)}
.reset-btn{display:inline-flex;align-items:center;gap:7px;font:500 13px var(--sans);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;transition:color .15s,border-color .15s,background .15s}
.reset-btn svg{width:15px;height:15px;flex:0 0 auto;transition:transform .35s ease}
.reset-btn:hover{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.reset-btn:hover svg{transform:rotate(-200deg)}
.confirm{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;background:var(--bad-soft);border:1px solid var(--bad);border-radius:10px;padding:10px 12px 10px 14px;animation:drop .18s ease-out}
.confirm p{flex:1 1 280px;margin:0;font-size:13.5px;color:var(--ink)}
.confirm p strong{color:var(--bad);font-weight:600}
.confirm .acts{display:flex;gap:8px}
.confirm button{font:600 13px var(--sans);border-radius:7px;padding:7px 13px;cursor:pointer}
.c-cancel{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.c-ok{background:var(--bad);color:var(--surface);border:1px solid var(--bad)}
.foot-confirm{margin-top:12px}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.note{font-size:13px;color:var(--muted);margin:14px 0 0}

/* guia "o que caiu" */
.callout{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px}
.callout h3{margin:0 0 8px;font:600 15px var(--sans)}
.callout ul{margin:0;padding-left:18px}
.callout li{margin:3px 0}
.callout blockquote{margin:12px 0 0;padding:10px 14px;border-left:3px solid var(--hot);background:var(--hot-soft);border-radius:0 8px 8px 0;font-size:14px}
.jumps{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.jumps .jl{font:500 12px var(--mono);color:var(--muted);letter-spacing:.03em;text-transform:uppercase;margin-bottom:5px}
.jumps .row{display:flex;flex-wrap:wrap;gap:6px}
.jump{font:600 12.5px var(--mono);border-radius:7px;padding:4px 10px;cursor:pointer;border:1px solid var(--hot);color:var(--hot);background:var(--hot-soft);transition:transform .15s var(--ease)}
.jump.alt{background:transparent}
.jump:hover{transform:translateY(-1px)}
.topics{display:flex;flex-direction:column;gap:12px}
.topic{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);transition:border-color .3s}
.topic.done{border-left-color:var(--ok)}
.topic-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.topic-h h3{margin:0;font:600 15.5px var(--sans)}
.topic-h .hot{margin-top:5px}
.topic ul{margin:10px 0 0;padding-left:18px;font-size:14px}
.topic li{margin:3px 0}
.topic p{margin:10px 0 0;font-size:14px}
.studied{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;font:500 12.5px var(--sans);border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:999px;padding:4px 11px 4px 7px;cursor:pointer;transition:all .2s}
.studied .box{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--muted);display:grid;place-items:center;transition:all .2s}
.studied .box svg{width:9px;height:9px;fill:none;stroke:var(--surface);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:all .25s var(--ease)}
.studied[aria-pressed="true"]{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.studied[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok)}
.studied[aria-pressed="true"] .box svg{opacity:1;transform:none}
.go{margin-top:12px}

/* resumo */
.sum-nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.sum-chip{display:inline-flex;align-items:center;gap:7px;font:500 13px var(--sans);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;transition:border-color .15s,transform .15s var(--ease),background .2s}
.sum-chip:hover{border-color:var(--accent);transform:translateY(-1px)}
.sum-chip i{font:600 11px var(--mono);font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);transition:background .2s,color .2s}
.sum-chip.read i{background:var(--ok);color:var(--surface)}
.topic.sum h3{display:flex;align-items:center;gap:9px;font-size:16.5px}
.topic.sum .sn{font:600 12px var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px}
.topic.sum{padding:16px 18px 18px}
.topic.sum>ul,.topic.sum>ol,.topic.sum>p,.topic.sum>.tbl-w,.topic.sum>.key,.topic.sum>.fig,.topic.sum>pre,.topic.sum>.enc,.topic.sum>.frame,.topic.sum>.modes{margin-top:12px}
.sub-h{font:600 12px var(--mono)!important;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-top:18px!important;margin-bottom:-4px}
.tbl-w{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;line-height:1.45}
.tbl th{text-align:left;font:600 11.5px var(--mono);letter-spacing:.03em;color:var(--muted);background:var(--surface-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
.tbl tr:first-child td{border-top:0}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover{background:var(--accent-soft)}
.tbl.nums td{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}
.tbl.nums td:first-child{font-family:var(--sans);font-size:13.5px}
.tbl code{font-size:12.5px;white-space:nowrap}

.e-d{background:var(--surface);border:1px solid var(--line);min-width:72px;text-align:center}
.e-4{background:color-mix(in srgb,var(--accent) 22%,transparent)} .e-3{background:color-mix(in srgb,var(--warn) 25%,transparent)}
.e-2{background:color-mix(in srgb,var(--hot) 22%,transparent)} .e-1{background:var(--code-bg);color:var(--code-ink)!important;letter-spacing:.12em}
.frame{display:flex;gap:2px;overflow-x:auto;padding-bottom:2px}

/* tabela de rotas */

.rt-how summary::-webkit-details-marker{display:none}
.rt-how summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg);transition:transform .2s}

.rt-how summary h3{margin:0}

.rt-anat span{border-bottom:2px solid;padding-bottom:1px}
.a1{border-color:#4FC2AF;color:#7fe0cf} .a2{border-color:#E8B85A;color:#f0cd85} .a3{border-color:#9b8cff;color:#c3b9ff} .a4{border-color:#FF8CC2;color:#ffb3d6} .a5{border-color:#7fb8ff;color:#a9d0ff}
.rt-legend{display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.rt-legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:8px;vertical-align:middle;background:currentColor;border:0}
.rt-legend i.a1{color:#4FC2AF} .rt-legend i.a2{color:#E8B85A} .rt-legend i.a3{color:#9b8cff} .rt-legend i.a4{color:#FF8CC2} .rt-legend i.a5{color:#7fb8ff}
#rtcard h3{font-size:15.5px;margin-bottom:12px;line-height:1.5}

.rt-pre{margin-bottom:12px;line-height:1.6}
.rt-pre .ln{display:inline-block;min-width:100%;padding:0 6px;margin:0 -6px;border-radius:4px;transition:background .3s,color .3s}
.rt-pre .ln.hit{background:rgba(232,184,90,.14)}
.rt-pre .ln.win{background:rgba(79,194,175,.28);color:#fff;box-shadow:inset 3px 0 0 #4FC2AF}
#rtcard.just-ok{animation:glow .8s ease-out}
#rtcard.just-bad .opt.wrong{animation:shake .42s}
#rtcard .fb{margin-top:12px;max-width:none;animation:reveal .4s var(--ease) both}
.rt-tbl tr.hit td{background:color-mix(in srgb,var(--warn) 10%,transparent)}
.rt-tbl tr.win td{background:var(--ok-soft);font-weight:600}
.rt-tbl td:nth-child(2){font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.rt-why{margin:12px 0 0;font-size:14px;line-height:1.6}

.rtx-head{margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
.rtx-g{display:flex;align-items:center;gap:9px;margin:22px 0 2px;font:600 16px var(--sans)}
.rtx-g span{font:600 12px var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px}
.rtx-d{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.src{display:inline-block;font:500 11.5px var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:2px 7px}

/* recomeçar */
body.modal-open{overflow:hidden}
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(6,14,12,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fadein .18s ease-out}
.sheet{width:min(560px,100%);max-height:min(86vh,760px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px -20px rgba(0,0,0,.45);animation:sheetin .22s var(--ease)}
@keyframes fadein{from{opacity:0}to{opacity:1}}

.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0;font-family:var(--display);font-stretch:112%;font-weight:600;font-size:19px}
.sheet-h p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.x{font:400 22px/1 var(--sans);width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);cursor:pointer}
.x:hover{color:var(--ink)}
.sheet-b{overflow-y:auto;padding:6px 18px 10px}
.rs-g{border:0;margin:10px 0 0;padding:0}
.rs-g legend{padding:0;margin-bottom:4px}
.rs-gl{display:flex;align-items:center;gap:9px;font:600 12px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--accent);cursor:pointer}
.rs-i{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;margin:0 -10px;border-radius:8px;cursor:pointer;transition:background .15s}
.rs-i:hover{background:var(--surface-2)}
.rs-i.off{opacity:.5;cursor:default} .rs-i.off:hover{background:transparent}
.rs-i input,.rs-gl input{position:absolute;opacity:0;pointer-events:none}
.cb{width:17px;height:17px;flex:0 0 auto;margin-top:2px;border:1.5px solid var(--muted);border-radius:5px;display:grid;place-items:center;transition:background .15s,border-color .15s}
.cb::after{content:"";width:9px;height:5px;border-left:2.2px solid var(--surface);border-bottom:2.2px solid var(--surface);transform:rotate(-45deg) scale(0);margin-top:-2px;transition:transform .18s var(--ease)}
input:checked+.cb{background:var(--bad);border-color:var(--bad)}
input:checked+.cb::after{transform:rotate(-45deg) scale(1)}
input:indeterminate+.cb{background:var(--bad);border-color:var(--bad)}
input:indeterminate+.cb::after{width:9px;height:0;border-left:0;border-bottom:2.2px solid var(--surface);transform:none;margin-top:0}
input:focus-visible+.cb{outline:2px solid var(--accent);outline-offset:2px}
.rs-gl .cb{margin-top:0}
.rs-t{display:flex;flex-direction:column;gap:1px;font-size:14px}
.rs-t b{font-weight:500}
.rs-t small{font:500 11.5px var(--mono);color:var(--muted)}
.rs-t em{font-style:normal;color:var(--accent)}
.rs-t .rs-warn{font-family:var(--sans);font-size:12.5px;color:var(--warn);margin-top:3px}
.sheet-f{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
.sheet-f .acts{display:flex;gap:8px}
.sheet-f button{font:600 13px var(--sans);border-radius:7px;padding:8px 14px;cursor:pointer}
.sheet-f .c-ok:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--accent);padding:8px 0!important}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));z-index:21;transform:translateX(-50%);display:flex;align-items:center;gap:14px;max-width:min(560px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 12px 10px 16px;font-size:13.5px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
.toast.in{animation:toastin .3s var(--ease)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translateX(-50%)}}
.toast button{flex:0 0 auto;font:600 13px var(--sans);background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:7px;padding:5px 11px;cursor:pointer}
:root:not([data-theme="light"]) .toast button{color:var(--accent)}

/* treino de contas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{margin:0 0 4px;font:600 15px var(--sans)}
.card .sub{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.tq{font-size:15.5px;margin:0 0 14px}
.tq code{font-size:16px;padding:2px 7px;color:var(--accent)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.field{display:flex;flex-direction:column;gap:5px;font:500 12.5px var(--sans);color:var(--muted)}
.field input,.calc-in{font:500 15px var(--mono);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;transition:border-color .2s,background .2s}
.field input:focus,.calc-in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field.ok input{border-color:var(--ok);background:var(--ok-soft)}
.field.bad input{border-color:var(--bad);background:var(--bad-soft)}
.field .ans{font:500 12px var(--mono);min-height:1em}
.field.ok .ans{color:var(--ok)} .field.bad .ans{color:var(--bad)}
.acts-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.verdict{font:600 13.5px var(--sans);margin-left:4px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.steps{margin:14px 0 0;padding:12px 14px 12px 32px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;font-size:14px}
.steps li{margin:5px 0}
.res{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:12px;font:500 13.5px var(--mono)}
.res dt{color:var(--muted);font-family:var(--sans)}
.res dd{margin:0}
.calc-err{color:var(--muted);font-size:13px;margin-top:8px}
details.how{margin-top:10px}
details.how summary{cursor:pointer;font:600 13px var(--sans);color:var(--accent)}

/* botão flutuante */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:6;display:inline-flex;align-items:center;gap:7px;font:600 13.5px var(--sans);border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:999px;padding:10px 16px;cursor:pointer;box-shadow:0 8px 24px -8px rgba(0,0,0,.35);transition:transform .3s var(--ease),opacity .3s}
.fab.off{opacity:0;transform:translateY(16px);pointer-events:none}
.fab svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* ---------- animações ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:.4;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes pop{0%{transform:scale(.4)}65%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 45%,transparent),var(--shadow)}100%{box-shadow:0 0 0 12px transparent,var(--shadow)}}
@keyframes reveal{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
@keyframes flash{0%,100%{box-shadow:var(--shadow)}25%,60%{box-shadow:0 0 0 3px var(--accent),var(--shadow)}}
@keyframes okpulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 50%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.enter>*{animation:rise .42s var(--ease) both;animation-delay:calc(var(--i,0)*32ms)}
.enter>.settled{animation:none}
.fresh .field.ok input{animation:okpulse .7s ease-out}
.fresh .field.bad input{animation:shake .42s}
.fresh .steps,.fresh .verdict{animation:reveal .4s var(--ease) both}
.q.just-ok{animation:glow .8s ease-out}
.q.just-ok .opt.right .dot,.q.just-bad .opt .dot{animation:pop .4s var(--ease)}
.q.just-bad .opt.wrong{animation:shake .42s}
.q.just-ok .fb,.q.just-bad .fb,.reveal .fb{animation:reveal .4s var(--ease) both}
.reveal .q{animation:rise .4s var(--ease) both;animation-delay:calc(var(--i,0)*30ms)}
.flash{animation:flash 1.5s ease}

@media (max-width:1320px){ #reset-all .rt{display:none} #reset-all{padding:6px 9px} }
@media (max-width:1060px){
  .hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand stat" "groups ctrl";align-items:center}
  .brand-w{grid-area:brand;min-width:0} .stat{grid-area:stat} .hrow .groups{grid-area:groups;justify-self:start;margin:0} .hrow .row-r{grid-area:ctrl;justify-self:end}
}

  .grp{padding:7px 11px}
  h1{font-size:18px} .logo{width:30px;height:30px} .brand-w{gap:8px}

  #reset-all{padding:6px 9px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
/* PV2: questões abertas e treino */
.openq{margin:10px 0 4px;display:grid;gap:10px}
.open-in{width:100%;min-height:92px;resize:vertical;font:14px/1.5 var(--sans);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.open-in:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.openq .btn{justify-self:start}
.model{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:10px 14px;font-size:14px;overflow-x:auto}
.model>strong{display:block;font-family:var(--display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}

.self{margin:0;font-size:13px;color:var(--muted)}

<script>
const PARTS = [
{ t:"Endereçamento IP", layer:"Camada 3", pts:5, qs:[
 {q:"Como é representado um endereço IPv6?", o:["4 dígitos no formato decimal","128 dígitos no formato hexadecimal","32 dígitos no formato decimal","Nenhuma das anteriores"], a:3,
  e:"O IPv6 tem 128 bits, escritos como 32 dígitos hexadecimais (8 grupos de 4, separados por “:”). Nenhuma alternativa diz isso: 128 é o número de bits, não de dígitos."},

 {q:"Uma máscara IP é constituída de duas partes, uma que identifica a rede (Net_Id), formada por bits 1, e outra que identifica os hosts (Host_Id), formada por bits 0.", o:["Verdade","Falso"], a:0,
  e:"Na máscara, os bits 1 marcam a porção de rede e os bits 0 marcam a porção de host."},
 {q:"O endereço MAC (endereço físico) é o endereço utilizado por dispositivos atuando em qual camada OSI?", o:["Camada 1","Camada 2","Camada 3","Camada 4"], a:1,

 {q:"Quantos bits existem em um endereço IP versão 6 (IPv6)?", o:["24","32","48","128"], a:3,

 {q:"Um roteador ao receber um pacote com IP origem 192.168.10.24, e fazendo uso da máscara /24, irá encaminhar este pacote por uma saída, em sua tabela de rotas, referente a rede destino 192.168.10.0/24.", o:["Verdade","Falso"], a:1,
  e:"O IP de origem é quem <b>mandou</b> o pacote; o de destino é para quem ele <b>vai</b>. Como um carteiro que olha o destinatário, e não o remetente, o roteador escolhe a saída pelo IP de <b>destino</b>. A conta está certa (192.168.10.24/24 é da rede 192.168.10.0/24), mas a afirmação usa o endereço errado para decidir a rota."},
 {q:"O endereço MAC, também chamado endereço físico, constituído de 48 bits, é o endereço utilizado pelo switch para o encaminhamento de quadros; já o endereço IP, também chamado endereço lógico, constituído de 32 bits (versão 4 do IP), é utilizado pelos roteadores para o encaminhamento de pacotes.", o:["Verdade","Falso"], a:0,
  e:"Tudo correto: MAC com 48 bits na camada 2 (switch, quadros) e IPv4 com 32 bits na camada 3 (roteador, pacotes)."},
 {q:"Qual o endereço de broadcast da rede a qual pertence o endereço 10.0.40.200 /16?", o:["10.0.40.0","10.0.0.0","10.0.40.255","10.0.255.255"], a:3,
  e:"Com /16, os dois primeiros octetos são rede (10.0) e os dois últimos são host. Broadcast = todos os bits de host em 1: 10.0.255.255."},
 {q:"Quantos bits existem em um endereço IP versão 4 (IPv4)?", o:["24","32","48","128"], a:1,
  e:"IPv4 = 32 bits, em 4 octetos de 8 bits."},
 {q:"Qual o endereço de rede a qual pertence o endereço 10.0.40.200 /16?", o:["10.0.40.0","10.0.0.0","10.0.40.255","10.0.255.255"], a:1,
  e:"Com /16, zera-se a parte de host (dois últimos octetos): 10.0.0.0."},
 {q:"Qual máscara de rede é representada pela notação /20?", o:["255.255.224.0","255.255.248.0","255.255.220.0","255.255.240.0"], a:3,
  e:"/20 = 8 + 8 + 4 bits. Quatro bits 1 no terceiro octeto: 11110000 = 240. Máscara 255.255.240.0."},
 {q:"Qual máscara de rede é representada pela notação /24?", o:["255.0.0.0","255.255.0.0","255.255.255.0","Nenhuma das anteriores"], a:2,
  e:"/24 = três octetos cheios de 1: 255.255.255.0."},
 {q:"A máscara de rede tem como papel principal permitir ao roteador descobrir o endereço IP do host destino a qual o pacote será encaminhado.", o:["Verdade","Falso"], a:1,
  e:"O IP do destino já vem no pacote. A máscara serve para descobrir a qual <b>rede</b> o endereço pertence (fazendo um AND entre IP e máscara)."},
 {q:"Qual máscara de rede é representada pela notação /27?", o:["255.255.255.0","255.255.255.128","255.255.255.192","255.255.255.224"], a:3,
  e:"/27 = 24 + 3 bits. Três bits 1 no último octeto: 11100000 = 224."},
 {q:"Como é representado um endereço MAC?", o:["Quatro dígitos no formato decimal","Doze dígitos no formato hexadecimal","Seis dígitos no formato decimal","Nenhuma das anteriores"], a:1,
  e:"48 bits ÷ 4 bits por dígito hexa = 12 dígitos hexadecimais (ex.: 00:1A:2B:3C:4D:5E)."},
 {q:"Como é representado um endereço IPv4?", o:["4 dígitos no formato decimal","128 dígitos no formato hexadecimal","32 dígitos no formato decimal","Nenhuma das anteriores"], a:0, flag:"Confira com o professor",
  e:"O IPv4 é escrito como 4 números decimais (de 0 a 255) separados por ponto. A alternativa diz “4 dígitos”, mas no sentido de 4 números, que é o que o professor provavelmente espera. Se ele for rigoroso com a palavra “dígitos”, a resposta seria “Nenhuma das anteriores”."},
 {q:"Qual máscara de rede é representada pela notação /16?", o:["255.0.0.0","255.255.0.0","255.255.255.0","Nenhuma das anteriores"], a:1,
  e:"/16 = dois octetos cheios de 1: 255.255.0.0."},
 {q:"O endereço IPv4 (endereço lógico) é o endereço utilizado por dispositivos atuando em qual camada OSI?", o:["Camada 1","Camada 2","Camada 3","Camada 4"], a:2, flag:"Foto cortada: a opção “Camada 4” foi deduzida",
  e:"O IP é o endereço da camada de rede (camada 3), usado pelos roteadores."},
 {q:"Quantos bits existem em um endereço MAC?", o:["24","32","48","128"], a:2,
  e:"MAC = 48 bits (24 do fabricante, o OUI, e 24 da placa)."},
 {q:"O endereço IP binário 11001101.11111111.10101010.11001101, em notação decimal equivale a:", o:["109.127.200.109","205.255.170.109","109.255.170.205","205.255.170.205"], a:3,
  e:"11001101 = 128+64+8+4+1 = 205; 11111111 = 255; 10101010 = 128+32+8+2 = 170. Resultado: 205.255.170.205."},
]},
{ t:"Roteamento", layer:"Camada 3", pts:10, qs:[
 {q:"Considerando ainda a tabela de roteamento mostrada na figura, o que o roteador fará com um pacote que possui um endereço IP destino igual a 192.168.11.200?", code:"TD", o:["Descartar o pacote.","Encaminhar o pacote pela interface Serial0/0/0.","Encaminhar o pacote pela interface GigabitEthernet0/0.","Encaminhar o pacote pela interface GigabitEthernet0/1."], a:3,
  e:"192.168.11.200 pertence à rede 192.168.11.0/24, que está diretamente conectada (C) à GigabitEthernet0/1. A rota mais específica ganha da rota padrão."},
 {q:"Qual das afirmativas é verdadeira sobre protocolos de roteamento link-state (estado de enlace)?", o:["Eles oferecem uma convergência mais rápida em grandes redes, se comparados ao Vetor de Distância.","Eles oferecem maior risco de ocorrência de loops de roteamento, se comparados ao Vetor de Distância.","Eles dependem de contagens de saltos maiores para determinar o melhor caminho.","Nenhuma das anteriores"], a:0,
  e:"No estado de enlace (ex.: OSPF), cada roteador conhece a topologia inteira e calcula as rotas com Dijkstra. Por isso converge mais rápido e tem menos risco de loops que o vetor de distância (ex.: RIP)."},
 {q:"Qual das seguintes alternativas é verdadeira com relação aos protocolos roteados?", o:["Permitem que os roteadores compartilhem informações sobre as redes e rotas conhecidas.","São usados pelos roteadores para manter suas tabelas de roteamento.","Transportam dados de usuário entre as redes.","Nenhuma das anteriores"], a:2,
  e:"Protocolo <b>roteado</b> (ex.: IP) é o que carrega os dados do usuário. As outras duas alternativas descrevem protocolos de <b>roteamento</b> (ex.: OSPF, RIP)."},
 {q:"Considerando a tabela de roteamento mostrada na figura, o que o roteador fará com um pacote que possui um endereço IP destino igual a 200.10.20.20?", code:"TD", o:["Descartar o pacote","Encaminhar o pacote para o roteador 209.165.200.226","Encaminhar o pacote pela interface GigabitEthernet0/0.","Encaminhar o pacote pela interface GigabitEthernet0/1."], a:1,
  e:"Nenhuma rede da tabela contém 200.10.20.20, mas existe a rota padrão (S* 0.0.0.0/0 via 209.165.200.226). O pacote é enviado para esse próximo salto."},
 {q:"Qual afirmativa descreve uma rota que foi aprendida dinamicamente?", o:["Classificada como rota padrão.","Classificada como rota estática.","Não é afetada por mudanças na topologia da rede.","Nenhuma das anteriores"], a:3,
  e:"Rota dinâmica é aprendida por um protocolo de roteamento e se ajusta automaticamente às mudanças de topologia. Ela não é estática, e “rota padrão” é outra classificação. Sobra “Nenhuma das anteriores”."},
 {q:"Considerando a tabela de roteamento mostrada na figura, o que o roteador fará com um pacote que possui um endereço IP destino igual a 200.10.20.20?", code:"SEM", o:["Descartar o pacote","Encaminhar o pacote pela interface Serial0/0/0.","Encaminhar o pacote pela interface GigabitEthernet0/0.","Encaminhar o pacote pela interface GigabitEthernet0/1."], a:0,
  e:"Esta tabela <b>não tem rota padrão</b> e nenhuma rede contém 200.10.20.20. Sem rota, o roteador descarta o pacote. Compare com a questão 4."},
 {q:"Que tipo de rota permite que um roteador envie pacotes mesmo que sua tabela de roteamento não contenha nenhuma rota para a rede de destino do pacote?", o:["Rota dinâmica","Rota genérica","Rota padrão","Nenhuma das anteriores"], a:2,
  e:"A rota padrão (0.0.0.0/0, “gateway of last resort”) é usada quando nenhuma outra rota combina com o destino."},
 {q:"Protocolo de roteamento classificados como IGP são aqueles que podem ser configurados somente em dispositivos que se encontram dentro de uma rede local. Os classificados como EGP podem ser configurados em dispositivos que se encontram em redes locais distintas.", o:["Verdade","Falso"], a:1,
  e:"A divisão é por <b>sistema autônomo</b>, não por rede local. IGP (OSPF, RIP) roteia dentro de um mesmo sistema autônomo, que pode ter muitas redes. EGP (BGP) roteia entre sistemas autônomos diferentes."},
 {q:"Uma diferença entre os protocolos “Vetor de distância” e “Estado de enlace”, é que os protocolos “Vetor de distância” possibilitam uma convergência mais rápida, uma vez que fazem uso do Algoritmo de Dijkstra.", o:["Verdade","Falso"], a:1,
  e:"É o contrário: quem usa Dijkstra e converge mais rápido é o <b>estado de enlace</b>. O vetor de distância usa Bellman-Ford."},
 {q:"Qual das seguintes é uma função básica de um roteador?", o:["Encaminhar pacotes com base no endereço MAC destino do pacote","Determinar o melhor caminho para enviar pacotes.","Controlar o fluxo de dados por meio do uso de endereços da Camada 2.","Nenhuma das anteriores"], a:1,
  e:"O roteador trabalha na camada 3: escolhe o melhor caminho com base no IP de destino. Encaminhar por MAC é função do switch."},
]},
{ t:"Modelos OSI e TCP/IP", layer:"Camadas 1–7", pts:null, qs:[
 {q:"Que modelo de referência divide as comunicações de rede em sete camadas distintas e foi criado para prover a interoperabilidade entre dispositivos e protocolos?", o:["IEEE","IETF","OSI","TCP/IP"], a:2,
  e:"O modelo OSI (da ISO) tem 7 camadas. O TCP/IP tem 4 (ou 5, dependendo do autor)."},
 {q:"A arquitetura TCP/IP define um conjunto de protocolos que têm por função implementar diferentes funções definidas no Modelo OSI.", o:["Verdade","Falso"], a:0, flag:"Confira com o professor",
  e:"Na prática, os protocolos TCP/IP cumprem as funções descritas pelas camadas do OSI, e é assim que a maioria dos materiais apresenta. A ressalva é histórica: o TCP/IP foi criado antes e de forma independente do OSI."},
 {q:"Quais três protocolos operam na camada de aplicação no modelo TCP/IP?", o:["IP, TCP e UDP","IP, HTTP e ICMP","HTTP, TCP e SMTP","HTTP, SMTP e FTP"], a:3,
  e:"HTTP, SMTP e FTP são de aplicação. TCP e UDP são de transporte; IP e ICMP são de rede."},
 {q:"No modelo OSI, qual camada é responsável pelos padrões de interfaceamento com os meios de transmissão?", o:["Aplicação","Enlace","Física","Rede"], a:2,
  e:"A camada física trata do meio: cabos, conectores, sinais elétricos/ópticos e transmissão de bits."},
 {q:"Um cliente cria um pacote para enviar a um servidor. O cliente está solicitando serviço HTTP. Qual número será usado como o número da porta de destino (padrão) no envio desse pacote?", o:["20","21","23","80"], a:3,
  e:"HTTP usa a porta 80. (20/21 = FTP, 23 = Telnet.)"},
 {q:"Aplicações multimídia em tempo real necessitam de rapidez no envio de suas informações. Assim, é mais indicado se faça uso dos serviços TCP.", o:["Verdade","Falso"], a:1,
  e:"Para tempo real, o indicado é o UDP: sem conexão e sem retransmissão, tem menos atraso. Perder um pacote é melhor que esperar por ele."},
 {q:"Aplicações Web, em que o controle de erros é importante. Assim, é mais indicado se faça uso dos serviços UDP.", o:["Verdade","Falso"], a:1,
  e:"Quando o controle de erros importa, o indicado é o TCP, que confirma a entrega e retransmite o que se perdeu."},
 {q:"A troca de informações entre as camadas de Aplicação e Transporte ocorrem por meio dos chamados “sockets”.", o:["Verdade","Falso"], a:0,
  e:"O socket é a interface entre o processo da aplicação e a camada de transporte."},
 {q:"Uma conexão lógica, entre duas aplicações (processos) finais, necessita para sua identificação de um único identificador de porta.", o:["Verdade","Falso"], a:1, flag:"Possível pegadinha",
  e:"Uma conexão é identificada por dois sockets: IP e porta de origem mais IP e porta de destino. Uma única porta não basta. A pegadinha está na palavra “único”."},
 {q:"As portas identificadas como “bem conhecidas” são aquelas já reservadas para serviços e aplicações específicas. Já as portas identificadas como “dinâmicas” são aquelas escolhidas pelo sistema operacional do cliente para identificar sua aplicação.", o:["Verdade","Falso"], a:0,
  e:"Bem conhecidas (0–1023) são reservadas a serviços como HTTP (80) e DNS (53). Dinâmicas/efêmeras (49152–65535) são sorteadas pelo sistema do cliente."},
]},
{ t:"Ethernet e VLAN", layer:"Camadas 1–2", pts:10, qs:[
 {q:"O padrão Ethernet está relacionado a quais camadas do modelo OSI?", o:["Aplicação e Rede","Transporte e Rede","Física e Enlace","Rede e Enlace","Nenhuma das anteriores"], a:2,
  e:"O Ethernet (IEEE 802.3) define o meio físico e o quadro de enlace: camadas 1 e 2."},
 {q:"Quais das seguintes alternativas são especificadas pelos padrões IEEE como subcamadas da camada de enlace de dados do modelo OSI?", o:["Media Access Control e Logical Link Communication","Logical Layer Control e Media Access Control","Logical Link Control e Media Access Control","Media Access Communication e Physical Access Communication","Nenhuma das anteriores"], a:2,
  e:"As subcamadas são LLC (Logical Link Control, IEEE 802.2) e MAC (Media Access Control). As outras alternativas trocam uma palavra do nome."},
 {q:"Qual das abaixo não é uma característica do padrão Ethernet?", o:["Facilidade de manutenção","Tecnologia livre de colisões","Baixo custo de instalação","Escalabilidade","Nenhuma das anteriores"], a:1,
  e:"O Ethernet original é um meio compartilhado com CSMA/CD, feito justamente para lidar com colisões. Ele não é “livre de colisões” por definição."},
 {q:"Qual é o propósito do preâmbulo em um quadro Ethernet?", o:["Identificar o endereço origem","Identificar o endereço destino","Marca o final das informações","Utilizado para a sincronização (1s e 0s alternados)","Nenhuma das anteriores"], a:3,
  e:"O preâmbulo (7 bytes de 10101010) sincroniza o relógio do receptor antes do quadro começar."},
 {q:"Qual das seguintes alternativas descreve os endereços padrão Ethernet?", o:["Endereço de 32 bits no formato decimal","Endereço de 128 bits no formato hexadecimal","Denominado endereço lógico","Denominado endereço físico","Nenhuma das anteriores"], a:3,
  e:"O endereço Ethernet é o MAC: 48 bits em hexadecimal, chamado endereço físico. “Lógico” é o IP."},
 {q:"Qual afirmativa é verdadeira sobre a implementação de VLAN?", o:["Aumenta o custo da infraestrutura da rede uma vez que necessitará de um número maior de switches.","Agrupam hosts logicamente, independentemente da localização física destes.","A carga da rede aumenta significativamente devido a informações de entroncamento adicionadas.","Dispositivos de VLANs diferentes nunca poderão se comunicar, uma vez que os mesmos estão isolados logicamente.","Nenhuma das anteriores"], a:1,
  e:"VLAN agrupa hosts por função, não por lugar. Ela não exige mais switches, a tag 802.1Q é pequena, e VLANs diferentes se comunicam por roteamento."},
 {q:"Um administrador de redes está determinando o melhor posicionamento de links de trunk (conexões tronco) de VLAN. Qual tipo de conexão ponto-a-ponto utiliza o trunking de VLAN?", o:["Entre dois switches que utilizam várias VLANs.","Entre um switch e um PC cliente.","Entre um switch e uma impressora de rede","Entre dois switches que compartilham uma VLAN padrão.","Nenhuma das anteriores"], a:0,
  e:"O trunk carrega várias VLANs num mesmo enlace, geralmente entre switches. PCs e impressoras usam porta de acesso (uma VLAN só)."},
 {q:"Em uma empresa há uma LAN subdividida em muitas VLANs. Deseja-se implementar o roteamento entre essas VLANs. Uma solução é adicionar qual dispositivo para essa funcionalidade?", o:["Switch de camada 2 (Layer 2).","Ponto de acesso sem fio (AP).","Conversor de mídias.","Roteador.","Nenhuma das anteriores"], a:3,
  e:"Roteamento entre VLANs precisa de um dispositivo de camada 3: roteador (ou switch L3)."},
 {q:"Uma pequena empresa usa a VLAN 10 para a rede da linha de montagem e a VLAN 20 para a rede do escritório. O que é necessário para permitir a comunicação entre essas duas VLANs?", o:["São necessários dois grupos de switches, cada um com portas configuradas para uma VLAN diferente.","É necessário um roteador para cada VLAN e links seriais entre os roteadores.","É necessário um switch camada 2 adicional com uma porta configurada como trunk para se conectar as duas VLANs.","É necessário um dispositivo de camada 3 (roteador ou switch layer 3) que permita o roteamento entre as VLANs.","Nenhuma das anteriores"], a:3,
  e:"VLANs diferentes são redes diferentes. Para ligá-las é preciso roteamento, feito por um dispositivo de camada 3. Um só roteador basta (ex.: router-on-a-stick)."},
 {q:"Em um ambiente Ethernet, usando switches, foram criadas quatro VLANs, uma para cada departamento dessa empresa. Desejando-se que os dispositivos das diferentes VLANs possam se comunicar, entre outros, qual dos procedimentos abaixo deve ser realizado?", o:["A cada switch deve ser atribuído um endereço de sub-rede diferente.","As portas de conexão entre os switches devem ser configuradas como portas de acesso","Pode ser conectado em um dos switches um roteador que implemente o roteamento.","Em cada switch, deve ser conectado um roteador que implemente roteamento","Nenhuma das anteriores"], a:2,
  e:"Um único roteador ligado a um dos switches (por trunk) já roteia todas as VLANs. A sub-rede é por VLAN, não por switch, e os links entre switches devem ser trunk, não acesso."},
]},
{ t:"Camada de aplicação", layer:"Camada 7", pts:10, qs:[
 {q:"Qual das afirmativas abaixo não é característica do HTTP?", o:["Utiliza como porta padrão o valor 80","Permite a troca de hipertextos entra aplicações","Opera no modo cliente/servidor","Trabalha no modo não orientado a conexão"], a:3, flag:"Confira com o professor",
  e:"O HTTP roda sobre TCP, que é orientado a conexão, então essa não é característica dele. Cuidado para não confundir com “sem estado” (stateless): isso o HTTP é, mas é outra ideia. As outras três alternativas são características do HTTP."},
 {q:"Após um navegador de internet efetuar uma requisição a um servidor web que está ouvindo a porta padrão, qual será o provável número de porta origem no cabeçalho TCP da resposta do servidor?", o:["80","21","22","1883"], a:0,
  e:"Na resposta, as portas se invertem: a origem é a porta do servidor (80) e o destino é a porta efêmera do cliente."},
 {q:"Que dispositivo em uma rede gerencia nomes de domínio e responde solicitações dos clientes para converter um nome de domínio no endereço IP associado?", o:["Hypertext Markup Language","Uniform Resource Locator","Servidor de nomes de domínio","Redirecionador de rede"], a:2,
  e:"É o servidor DNS (Domain Name System), que traduz nomes em endereços IP. HTML e URL não são dispositivos."},
 {q:"Qual dos seguintes serviços é usado para resolver um endereço web em endereço IP?", o:["DNS","SNMP","SMTP","NAT"], a:0,
  e:"DNS resolve nomes. SNMP é gerência de rede, SMTP é e-mail e NAT traduz endereços privados para públicos."},
 {q:"O modelo de comunicação utilizado pelo MQTT é:", o:["Cliente-servidor direto","Ponto a ponto (peer-to-peer)","Broadcast puro","Publicação/assinatura (publish/subscribe)"], a:3,
  e:"No MQTT, clientes publicam e assinam tópicos por meio de um broker (intermediário)."},
 {q:"Qual das características abaixo é uma vantagem do MQTT?", o:["Alto consumo de banda","Dependência de conexões cabeadas","Comunicação direta entre clientes","Leveza e eficiência para IoT"], a:3,
  e:"O MQTT tem cabeçalho mínimo e pouco consumo de banda e energia, por isso é tão usado em IoT."},
 {q:"O protocolo MQTT é classificado como:", o:["Protocolo de transporte","Protocolo de rede","Protocolo de aplicação","Protocolo de enlace"], a:2,
  e:"MQTT é de aplicação e roda sobre TCP (porta 1883, que aparece como distrator na questão 2)."},
 {q:"Um servidor TLD é responsável por enviar:", o:["O endereço IP de um servidor raiz responsável pelo domínio buscado","O endereço IP do domínio buscado","O endereço de um servidor autoritativo responsável pelo domínio buscado","O domínio correspondente a um endereço IP buscado"], a:2,
  e:"A consulta segue a ordem raiz → TLD (.com, .br) → autoritativo. O TLD indica qual servidor autoritativo tem a resposta, e é o autoritativo que devolve o IP."},
 {q:"O protocolo HTTP tem como objetivo permitir a troca de mensagens entre um servidor e um cliente Web, definindo como essas páginas são requisitadas pelos clientes e enviadas pelos servidores.", o:["Verdade","Falso"], a:0,
  e:"Essa é a definição do HTTP: um protocolo de requisição e resposta entre cliente e servidor web."},
 {q:"De modo geral, ambos os protocolos DNS e HTTP fazem uso do UDP como protocolo de transporte", o:["Verdade","Falso"], a:1,
  e:"O DNS usa UDP (porta 53), mas o HTTP usa TCP (porta 80). Como a afirmação diz “ambos”, é falsa."},
]},
{ t:"TCP e UDP", layer:"Camada 4", pts:10, qs:[
 {q:"Qual é a principal vantagem do protocolo UDP em relação ao TCP?", o:["Garantia de entrega de pacotes","Estabelecimento de conexão antes da transmissão","Oferece controle de congestionamento","Maior rapidez e menor overhead","Nenhuma das anteriores"], a:3,
  e:"O UDP não tem handshake, confirmações nem retransmissão, e seu cabeçalho tem só 8 bytes. As outras alternativas são características do TCP."},
 {q:"Qual das seguintes aplicações normalmente utiliza o protocolo TCP?", o:["Streaming de vídeo ao vivo","Jogos online","Transmissão de voz sobre IP (VoIP)","Transferência de arquivos (FTP)","Nenhuma das anteriores"], a:3,
  e:"Um arquivo precisa chegar inteiro e correto, então o FTP usa TCP. As demais são de tempo real e costumam usar UDP."},
 {q:"Quais os números de porta padrão usadas para conexões TCP e UDP, respectivamente, para os protocolos HTTP e DNS?", o:["80 e 53","80 e 23","53 e 23","23 e 80","Nenhuma das anteriores"], a:0,
  e:"HTTP usa TCP na porta 80; DNS usa UDP na porta 53. (23 = Telnet.)"},
 {q:"Qual das seguintes é uma característica do UDP?", o:["Garante a ordem dos pacotes na entrega","Opera no modo orientado à conexão","Mais adequado para aplicações que exigem baixa latência (menor atraso)","É mais confiável que o TCP","Nenhuma das anteriores"], a:2,
  e:"O UDP tem menos atraso, por isso serve para aplicações sensíveis à latência. As outras alternativas descrevem o TCP."},
 {q:"Em uma comunicação usando o protocolo UDP, se um pacote for corrompido durante a transmissão, o que acontece?", o:["O pacote é automaticamente retransmitido pelo UDP","O UDP receptor solicita um novo pacote","O pacote é simplesmente descartado no receptor e não há retransmissão pelo UDP","O UDP destino descarta o pacote e solicita uma retransmissão do pacote","Nenhuma das anteriores"], a:2,
  e:"O checksum do UDP detecta o erro e o segmento é descartado. O UDP não tem retransmissão; se ela for necessária, quem cuida é a aplicação."},
 {q:"Qual das seguintes é uma característica do TCP?", o:["Não verifica se os pacotes chegaram ao destino","Viabiliza a entrega dos pacotes na ordem correta","Não estabelece conexão antes de transmitir dados","Opera no modo “não confiável”","Nenhuma das anteriores"], a:1,
  e:"Com números de sequência, o TCP reordena os segmentos e entrega os dados na ordem certa. As outras alternativas descrevem o UDP."},
 {q:"O que acontece se um segmento TCP for perdido durante a transmissão?", o:["O segmento é retransmitido","A conexão é encerrada imediatamente","O segmento é substituído por outro","O segmento é ignorado e a transmissão continua","Nenhuma das anteriores"], a:0,
  e:"Se a confirmação (ACK) não chega a tempo, ou chegam ACKs duplicados, o emissor retransmite o segmento."},
 {q:"Qual dos seguintes serviços de rede utiliza o protocolo UDP por padrão?", o:["HTTP","FTP","SSH","DNS","Nenhuma das anteriores"], a:3,
  e:"As consultas DNS usam UDP 53 por padrão. HTTP, FTP e SSH usam TCP."},
 {q:"Em qual das seguintes situações o protocolo UDP seria mais apropriado que o TCP?", o:["Envio de e-mails","Streaming de vídeo","Acesso remoto via SSH","Download de arquivos grandes","Nenhuma das anteriores"], a:1,
  e:"Em streaming (principalmente ao vivo), perder um quadro é melhor que atrasar. E-mail, SSH e downloads precisam de integridade, então usam TCP."},

const LBL = {router:[31,-25,23], switch:[27,-19,28], pc:[26,-21,20], server:[31,-23,17], cloud:[27,-35,32]};

function dg(w, h, nodes, links){
  const N = {}; nodes.forEach(n => N[n.id] = n);
  const f = v => v.toFixed(1);
  const txt = (x,y,s,cls,anc="middle") => `<text x="${f(x)}" y="${f(y)}" text-anchor="${anc}" class="${cls}">${esc(s)}</text>`;
  let L = "", T = "";
  links.forEach(([a,b,o={}]) => {
    const A=N[a], B=N[b], dx=B.x-A.x, dy=B.y-A.y, len=Math.hypot(dx,dy), ux=dx/len, uy=dy/len, nx=-uy, ny=ux;
    const mx=(A.x+B.x)/2, my=(A.y+B.y)/2;
    if(o.serial){
      const P=[[A.x,A.y],[mx-ux*8,my-uy*8],[mx+nx*7,my+ny*7],[mx-nx*7,my-ny*7],[mx+ux*8,my+uy*8],[B.x,B.y]];
      L += `<polyline class="dg-l" points="${P.map(p=>f(p[0])+","+f(p[1])).join(" ")}"/>`;
    } else L += `<line class="dg-l" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}"/>`;
    const lab = (s, t, side) => {
      if(!s) return;
      let x=A.x+dx*t+nx*side*8, y=A.y+dy*t+ny*side*8, anc="middle";
      if(Math.abs(ny) >= .5){ y += ny*side > 0 ? 10 : -2; }
      else { anc = nx*side > 0 ? "start" : "end"; y += 4; }
      T += txt(x, y, s, "dg-s", anc);
    };
    lab(o.a, o.at ?? .27, o.as ?? -1);
    lab(o.b, o.bt ?? .73, o.bs ?? 1);
    lab(o.m, .5, o.ms ?? -1);
  });
  const G = nodes.map(n => {
    const [bl,tl,sl] = LBL[n.t], p = n.lp || "b";
    let lb = "";
    const lines = [n.l, n.l2].filter(Boolean);
    lines.forEach((s,j) => {
      const cls = j ? "dg-s" : "dg-t";
      if(p==="b") lb += txt(n.x, n.y+bl+j*13, s, cls);
      else if(p==="t") lb += txt(n.x, n.y+tl-(lines.length-1-j)*13, s, cls);
      else if(p==="l") lb += txt(n.x-sl, n.y+4+(j-(lines.length-1)/2)*13, s, cls, "end");
      else lb += txt(n.x+sl, n.y+4+(j-(lines.length-1)/2)*13, s, cls, "start");
    });
    return `<g class="${n.c?"dg-"+n.c:""}"><g transform="translate(${n.x} ${n.y})">${ICON[n.t]}</g>${lb}</g>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" style="max-width:${w}px" role="img" aria-label="Topologia de rede">${L}${G}${T}</svg>`;
}

// linhas do cabeçalho: [[rótulo, bits, valor?], ...]
function hdr(rows, cap){
  const cell = ([l,bits,v]) => `<div class="hdr-cell" style="grid-column:span ${bits}">${esc(l)}${v!=null?`<b>${esc(v)}</b>`:""}<small>${bits} bits</small></div>`;
  return `<div class="hdr"><div class="hdr-ruler"><span style="grid-column:1/9">0</span><span style="grid-column:9/17">15</span><span style="grid-column:17/25">16</span><span style="grid-column:25/33">31</span></div>`+
    rows.map(r => `<div class="hdr-row">${r.map(cell).join("")}</div>`).join("") + (cap?`<div class="hdr-cap">${esc(cap)}</div>`:"") + `</div>`;
}
